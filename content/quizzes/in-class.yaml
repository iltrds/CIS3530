id: in-class
title: In-class quiz simulator
description: Copies Quiz 1's format. 10 points across 5 questions on one week, answers checked at the end, True/False typed exactly.
kind: quiz
covers: one_week
timeLimitMin: 10          # the real limit isn't shown on the results page; Quiz 1 took about 6 minutes
strictAnswers: true       # "True", not "TRUE" or "true", as CourseLink requires
feedback: end
slots:
  - { name: Concepts, types: [mcq], count: 3, points: 1, preferTags: [quiz-style, negated-stem, terminology, all-none-option] }
  - { name: Applied, types: [matching], count: 1, points: 3 }
  - { name: Applied, types: [blanks], count: 1, points: 4 }
