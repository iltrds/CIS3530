id: in-class
title: In-class quiz, concepts format
label: Concepts format
description: Three 1-point multiple-choice questions, a 3-point matching question and a 4-point True/False fill-in, on one week. Marked when you submit. True and False must be typed exactly, as CourseLink requires.
kind: quiz
covers: one_week
timeLimitMin: 10          # in-class quizzes are short; adjust if the real limit differs
strictAnswers: true       # "True", not "TRUE" or "true", as CourseLink requires
feedback: end
slots:
  - { name: Concepts, types: [mcq], count: 3, points: 1, preferTags: [quiz-style, negated-stem, terminology, all-none-option] }
  - { name: Applied, types: [matching], count: 1, points: 3 }
  - { name: Applied, types: [blanks], count: 1, points: 4 }
