  dataset: movies-v1
  show: { tables: [Artists, Roles] }
  prompt: How many tuples are in Artists × Roles?
  answer: 24
  explanation: "|Artists| × |Roles| = 4 × 6 = 24."

- id: w2-q-artists-join-roles
  type: numeric
  topics: [ra.natjoin, ra.degree-cardinality]
  difficulty: 2
  dataset: movies-v1
  show: { tables: [Artists, Roles] }
  prompt: How many tuples are in Artists ⋈ Roles?
  answer: 6
  explanation: They join on aID. Every Roles tuple has an aID that exists in Artists, so each of the 6 roles matches exactly one artist.

- id: w2-q-movies-join-roles-degree
  type: numeric
  topics: [ra.natjoin, ra.degree-cardinality]
  difficulty: 1
  dataset: movies-v1
  prompt: What is the degree of Movies ⋈ Roles?
  answer: 7
  explanation: "5 + 3 − 1 common attribute (mID) = 7."

- id: w2-q-theta-degree
  type: numeric
  topics: [ra.theta, ra.degree-cardinality]
  difficulty: 2
  dataset: movies-v1
  prompt: "What is the degree of Movies ⋈<sub>Movies.mID = Roles.mID</sub> Roles (a theta join)?"
  answer: 8
  explanation: "A theta join is σ(Movies × Roles), so no column is dropped: 5 + 3 = 8."

- id: w2-q-toy-product
  type: numeric
  topics: [ra.product, ra.degree-cardinality]
  difficulty: 1
  tags: [worksheet-variant]
  dataset: toy
  show: { tables: [R1, R2] }
  prompt: What is the cardinality of R1 × R2?
  answer: 18
  explanation: "6 × 3 = 18. (Its degree is 3 + 4 = 7.)"

- id: w2-q-toy-join-degree
  type: numeric
  topics: [ra.natjoin, ra.degree-cardinality]
  difficulty: 2
  tags: [worksheet-variant]
  dataset: toy
  show: { tables: [R1, R2] }
  prompt: What is the degree of R1 ⋈ R2?
  answer: 5
  explanation: "They share C1 and C2: 3 + 4 − 2 = 5."

- id: w2-q-toy-join-card
  type: numeric
  topics: [ra.natjoin, ra.degree-cardinality]
  difficulty: 2
  tags: [worksheet-variant]
  dataset: toy
  show: { tables: [R1, R2] }
  prompt: What is the cardinality of R1 ⋈ R2?
  answer: 2
  explanation: "Only (A, 1) and (B, 2) appear in both on C1 and C2."

- id: w2-q-toy-left-card
  type: numeric
  topics: [ra.outer, ra.degree-cardinality]
  difficulty: 2
  tags: [worksheet-variant]
  dataset: toy
  show: { tables: [R1, R2] }
  prompt: What is the cardinality of R1 ⟕ R2 (left outer join)?
  answer: 6
  explanation: "The 2 matching tuples, plus the 4 R1 tuples with no match padded with nulls: every R1 tuple appears once."

- id: w2-q-toy-right-card
  type: numeric
  topics: [ra.outer, ra.degree-cardinality]
  difficulty: 2
  tags: [worksheet-variant]
  dataset: toy
  show: { tables: [R1, R2] }
  prompt: What is the cardinality of R1 ⟖ R2 (right outer join)?
  answer: 3
  explanation: "The 2 matches, plus R2's (D, 1, z, 3), which matches nothing and is padded."

- id: w2-q-toy-full-card
  type: numeric
  topics: [ra.outer, ra.degree-cardinality]
  difficulty: 2
  dataset: toy
  show: { tables: [R1, R2] }
  prompt: What is the cardinality of R1 ⟗ R2 (full outer join)?
  answer: 7
  explanation: "2 matches + 4 unmatched from R1 + 1 unmatched from R2."

- id: w2-q-predict-left
  type: predict_table
  topics: [ra.outer]
  difficulty: 2
  dataset: toy
  show: { tables: [J1, J2] }
  prompt: Fill in the result of J1 ⟕ J2. Write null for a padded value.
  ra: J1 ⟕ J2
  explanation: "a matches both J2 tuples with col1 = 1. b has no match, so it is kept and padded with null."

- id: w2-q-predict-division-slide
  type: predict_table
  topics: [ra.division]
  difficulty: 1
  dataset: toy
  show: { tables: [D1, D2] }
  prompt: Fill in the result of D1 ÷ D2.
  ra: D1 ÷ D2
  explanation: "A and B appear with both 1 and 2. C appears only with 1."

- id: w2-q-predict-division-2
  type: predict_table
  topics: [ra.division]
  difficulty: 3
  tags: [worksheet-variant]
  dataset: toy
  show: { tables: [R1] }
  prompt: "Fill in the result of π<sub>C1, C3</sub>(R1) ÷ π<sub>C3</sub>(σ<sub>C1 = 'B'</sub>(R1))."
  ra: "π C1, C3 (R1) ÷ π C3 (σ C1 = 'B' (R1))"
  explanation: "The divisor is B's C3 values, {b, c}. B has both b and c; C has c and b; A has only a."

- id: w2-q-predict-join
  type: predict_table
  topics: [ra.natjoin]
  difficulty: 2
  dataset: toy
  show: { tables: [R1, R3] }
  prompt: Fill in the result of R1 ⋈ R3.
  ra: R1 ⋈ R3
  explanation: "They share C1, C2 and C3, so a tuple joins only when all three match: (A, 1, a) and (B, 2, c)."

- id: w2-q-predict-minus
  type: predict_table
  topics: [ra.set-ops]
  difficulty: 1
  dataset: toy
  show: { tables: [R1, R3] }
  prompt: "Fill in the result of π<sub>C3</sub>(R1) − π<sub>C3</sub>(R3)."
  ra: "π C3 (R1) − π C3 (R3)"
  explanation: "R1's C3 values are {a, b, c}; R3's are {a, c}. Only b is left."

