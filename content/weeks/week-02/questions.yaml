- id: w2-q-select-degree
  type: mcq
  topics: [ra.select, ra.degree-cardinality]
  difficulty: 1
  prompt: "R₁ = σ<sub>length < 140</sub>(Movies). Which is true?"
  options:
    - Degree of R₁ < degree of Movies
    - Degree of R₁ = degree of Movies, cardinality of R₁ ≤ cardinality of Movies
    - Degree of R₁ = degree of Movies, cardinality of R₁ = cardinality of Movies
    - Cardinality of R₁ > cardinality of Movies
  answer: 1
  explanation: Select keeps every attribute and some (possibly all, possibly none) of the tuples.

