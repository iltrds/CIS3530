  type: ra
  topics: [ra.set-ops]
  difficulty: 2
  dataset: set-ops
  show: { tables: [Student, Instructor] }
  prompt: List the first names that belong to both an instructor and a student.
  reference: "π first_name (Instructor) ∩ π first_name (Student)"

- id: w2-q-union-compat
  type: mcq
  topics: [ra.set-ops]
  difficulty: 2
  dataset: set-ops
  show: { tables: [Student, Instructor] }
  prompt: "Are Student(student_id, first_name) and Instructor(first_name, last_name) union compatible?"
  options:
    - "Yes: both have degree 2"
    - "No: the domain of the first attribute differs"
    - "Yes: both have a first_name attribute"
    - "No: they have different cardinalities"
  answer: 1
  explanation: "Union compatibility needs the same degree **and** matching domains position by position. student_id is an integer; Instructor's first attribute is text. Cardinality doesn't matter."

- id: w2-q-not-true-natjoin
  type: mcq
  topics: [ra.natjoin]
  difficulty: 2
  tags: [negated-stem, quiz-style]
  prompt: Which of the following is **not true** about natural join?
  options:
    - R ⋈ S = S ⋈ R, apart from the order of attributes.
    - If R and S share no attribute names, R ⋈ S = R × S.
    - R ⋈ S keeps both copies of every attribute R and S have in common.
    - R ⋈ (S ⋈ T) = (R ⋈ S) ⋈ T
    - None of the given choices
  answer: 2
  explanation: Natural join projects away the duplicate copy of each common attribute. A theta join keeps both.

- id: w2-q-theta-def
  type: mcq
  topics: [ra.theta]
  difficulty: 1
  prompt: "R ⋈<sub>c</sub> S (theta join) is equivalent to…"
  options:
    - "σ<sub>c</sub>(R ⋈ S)"
    - "σ<sub>c</sub>(R × S)"
    - "π<sub>c</sub>(R × S)"
    - "R × σ<sub>c</sub>(S)"
  answer: 1
  explanation: A theta join is a Cartesian product followed by a select, not a natural join followed by a select.

- id: w2-q-precedence
  type: mcq
  topics: [ra.precedence]
  difficulty: 2
  prompt: "Which operator has the **lowest** precedence?"
  options: ["σ", "⋈", "∩", "∪"]
  answer: 3
  explanation: "σ, π bind tightest, then × and ⋈, then ∩, then ∪ and −."

- id: w2-q-every-cue
  type: mcq
  topics: [ra.strategy, ra.division]
  difficulty: 1
  prompt: "\"Find suppliers who supply **all** red parts.\" Which operator does the wording point to?"
  options: ["×", "÷", "−", "ρ"]
  answer: 1
  explanation: "\"All\" and \"every\" are the cue for division."

- id: w2-q-selfjoin
  type: mcq
  topics: [ra.strategy, ra.rename-assign]
  difficulty: 2
  prompt: To find pairs of movies with the same director, what do you need?
  options:
    - Movies ⋈ Movies
    - Two renamed copies of Movies, a product, and a select
    - Movies ÷ Movies
    - π director (Movies) ∩ π director (Movies)
  answer: 1
  explanation: "Movies ⋈ Movies matches on every attribute and just returns Movies. A self join needs ρ to name the two copies, then × and σ."

- id: w2-q-assign
  type: true_false
  topics: [ra.rename-assign]
  difficulty: 1
  prompt: "Movies := σ year > 1980 (Movies) deletes the older movies from the Movies relation."
  answer: false
  explanation: Assignment only defines a temporary relation, and its name must be new. It never updates a relation in the schema.

- id: w2-q-match-operators
  type: matching
  topics: [ra.select, ra.project, ra.product, ra.division]
  difficulty: 1
  points: 3
  tags: [quiz-style]
  prompt: Match each operator to what it does.
  left: ["σ", "π", "÷"]
  right:
    - Keeps the values that appear with every tuple of the divisor
    - Chooses rows
    - Chooses columns
  answer: [1, 2, 0]

- id: w2-q-match-degrees
  type: matching
  topics: [ra.degree-cardinality]
  difficulty: 2
  points: 3
  tags: [quiz-style]
  prompt: "R has degree 3 and S has degree 2, and they share one attribute name. Match each expression to the degree of its result."
  left: ["R × S", "R ⋈ S", "π<sub>A</sub>(R) ∪ π<sub>B</sub>(S)"]
  right: ["1", "4", "5"]
  answer: [2, 1, 0]
  explanation: "3 + 2 = 5; 3 + 2 − 1 = 4; each side of the union is projected to one attribute."

- id: w2-q-blanks-ra-1
  type: blanks
  topics: [ra.select, ra.project, ra.natjoin]
  difficulty: 2
  points: 4
  tags: [quiz-style]
  prompt: "Type **True** or **False** in each box."
  parts:
    - { text: "The degree of σ<sub>c</sub>(R) always equals the degree of R.", answer: "True" }
    - { text: "π<sub>L</sub>(R) can have more tuples than R.", answer: "False" }
    - { text: "If R and S share no attribute names, R ⋈ S is the same as R × S.", answer: "True" }
    - { text: "A theta join is a natural join followed by a select.", answer: "False" }
  explanation: "Select never changes the columns. Projection can only merge duplicates. With no shared names there's nothing to match on. A theta join is a *product* followed by a select."

- id: w2-q-blanks-ra-2
  type: blanks
  topics: [ra.set-ops, ra.division, ra.outer]
  difficulty: 2
  points: 4
  tags: [quiz-style, trap]
  prompt: "Type **True** or **False** in each box."
  parts:
    - { text: "R − S = S − R for any union-compatible R and S.", answer: "False" }
    - { text: "For R ÷ S, every attribute of S must be an attribute of R.", answer: "True" }
    - { text: "Two relations with the same degree are always union compatible.", answer: "False" }
    - { text: "A left outer join keeps every tuple of the left operand.", answer: "True" }
  explanation: "Difference isn't commutative. Division requires S's attributes to be a subset of R's. Union compatibility also needs matching domains. Left outer join pads unmatched left tuples rather than dropping them."
