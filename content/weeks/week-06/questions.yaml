- id: w6-q-abc3-tf-4
  type: true_false
  topics: [er.reading, er.participation]
  difficulty: 2
  tags: [er-abc, quiz-style]
  prompt: |
    {{er:w6-abc-3}}

    If B represents CLUBS and C represents EVENTS the clubs host, then this ER model states that an event cannot exist in this database without a host club. True or false?
  answer: true
  explanation: "C's line to S is double: total participation."

- id: w6-q-abc3-tf-5
  type: true_false
  topics: [er.reading, er.participation, er.cardinality]
  difficulty: 3
  tags: [er-abc, quiz-style, trap]
  prompt: |
    {{er:w6-abc-3}}

    If B represents CLUBS and C represents EVENTS the clubs host, then this ER model states that every club hosts one or more events. True or false?
  answer: false
  explanation: "The N lets a club host many events, but B's line to S is single, so a club may host none. \"One or more\" needs a double line."

- id: w6-q-abc4-tf-1
  type: true_false
  topics: [er.reading, er.cardinality, er.participation]
  difficulty: 2
  tags: [er-abc, quiz-style]
  prompt: |
    {{er:w6-abc-4}}

    If A represents CUSTOMERS and B represents ORDERS, then this ER model states that every order belongs to exactly one customer. True or false?
  answer: true
  explanation: "The 1 next to A gives at most one customer per order; B's double line to R gives at least one."

- id: w6-q-abc4-tf-2
  type: true_false
  topics: [er.reading, er.participation]
  difficulty: 2
  tags: [er-abc, quiz-style]
  prompt: |
    {{er:w6-abc-4}}

    If A represents CUSTOMERS and B represents ORDERS, then this ER model allows a customer to be stored without having placed any order. True or false?
  answer: false
  explanation: "A's line to R is double: every customer takes part in at least one R instance."

- id: w6-q-abc4-tf-3
  type: true_false
  topics: [er.reading, er.participation]
  difficulty: 2
  tags: [er-abc, quiz-style]
  prompt: |
    {{er:w6-abc-4}}

    If B represents ORDERS and C represents INVOICES, then this ER model states that every order must have an invoice. True or false?
  answer: false
  explanation: "B's line to S is single (partial). C's is double: every invoice is for an order."

- id: w6-q-abc4-tf-4
  type: true_false
  topics: [er.reading, er.cardinality]
  difficulty: 1
  tags: [er-abc, quiz-style]
  prompt: |
    {{er:w6-abc-4}}

    If B represents ORDERS and C represents INVOICES, then this ER model states that an invoice can cover two orders. True or false?
  answer: false
  explanation: "Orders per invoice is the number next to B on S: 1."

- id: w6-q-abc4-tf-5
  type: true_false
  topics: [er.reading, er.cardinality]
  difficulty: 1
  tags: [er-abc, quiz-style]
  prompt: |
    {{er:w6-abc-4}}

    If A represents CUSTOMERS and B represents ORDERS, then this ER model states that a customer can place several orders. True or false?
  answer: true
  explanation: "Orders per customer is the number next to B on R: N."

# ---------------------------------------------------------------- Quiz 5 style, Section I: which relationship instances are possible

- id: w6-q-inst-abc1-1
  type: instance_choices
  topics: [er.reading, er.cardinality, er.participation]
  difficulty: 2
  tags: [quiz-style]
  diagram: w6-abc-1
  relationships: [R, S]
  sets: { A: [a1, a2], B: [b1, b2], C: [c1, c2] }
  candidates:
    - instances: { R: [[a1, b1], [a2, b1]], S: [[b1, c1], [b2, c2]] }
    - instances: { R: [[a1, b1], [a1, b2]], S: [[b1, c1], [b2, c2]] }
    - instances: { R: [[a1, b1]], S: [[b1, c1]] }
    - instances: { R: [[a2, b2]], S: [[b1, c1], [b1, c2]] }
  explanation: "Check each line of the model: the 1 next to B (one B per A), the 1 next to C (one C per B), and C's double line (every C appears in S). Partial participation never rules an instance out."

