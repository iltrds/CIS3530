# ---------------------------------------------------------------- Quiz 5 style, Section II: name the kind of attribute

- id: w6-q-kind-skills
  type: short
  style: conceptual
  topics: [er.attributes]
  difficulty: 1
  tags: [attr-kind, quiz-style]
  prompt: "Assume an employee has a SIN, a name, and may list one or more skills, e.g. 'SQL', 'Excel' and 'Spanish'. What type of attribute is skills?"
  answers: [multivalued, multi-valued, multivalued attribute, multi-valued attribute, multi valued]
  explanation: "Several values for one entity: multivalued, drawn as a double oval. (Its data type might be text, but the question is about the ER classification.)"

- id: w6-q-kind-address
  type: short
  style: conceptual
  topics: [er.attributes]
  difficulty: 1
  tags: [attr-kind, quiz-style]
  prompt: "Assume each customer has exactly one mailing address, recorded as a street, a city and a postal code, each of which we may search on separately. What type of attribute is mailing address?"
  answers: [composite, composite attribute]
  explanation: "One value made of meaningful parts: composite, drawn as an oval with its parts' ovals hanging off it."

- id: w6-q-kind-age
  type: short
  style: conceptual
  topics: [er.attributes]
  difficulty: 1
  tags: [attr-kind, quiz-style]
  prompt: "Assume a patient's date of birth is stored, and the system shows each patient's age, worked out from it. What type of attribute is age?"
  answers: [derived, derived attribute]
  explanation: "Computable from another attribute: derived (the course draws it with no special notation; the textbook uses a dashed oval)."

- id: w6-q-kind-studentno
  type: short
  style: conceptual
  topics: [er.keys, er.attributes]
  difficulty: 1
  tags: [attr-kind, quiz-style]
  prompt: "Assume every student has a student number, and no two students ever share one. What type of attribute is student number?"
  answers: [key, key attribute, a key attribute, identifier]
  explanation: "Its value is different for every entity: a key attribute, underlined in the diagram."

- id: w6-q-kind-seat
  type: short
  style: conceptual
  topics: [er.weak, er.keys]
  difficulty: 2
  tags: [attr-kind, quiz-style, trap]
  prompt: "Assume a theatre's seats are labelled A1, A2, … in every theatre, so only a theatre plus a seat label identifies a seat, and a seat can't exist without its theatre. In the SEAT entity type, what type of attribute is the seat label?"
  answers: [partial key, a partial key, discriminator, a discriminator]
  explanation: "SEAT is a weak entity type; the label distinguishes the seats of one theatre, so it's a partial key (dashed underline)."

- id: w6-q-kind-price
  type: short
  style: conceptual
  topics: [er.attributes]
  difficulty: 1
  tags: [attr-kind, quiz-style]
  prompt: "Assume a product stores a base price and a tax rate, and its total price is always the base price plus tax. What type of attribute is total price?"
  answers: [derived, derived attribute]
  explanation: "It's computed from other stored attributes, so it's derived."

- id: w6-q-kind-phones
  type: short
  style: conceptual
  topics: [er.attributes]
  difficulty: 3
  tags: [attr-kind, quiz-style, trap]
  prompt: "Assume a contact can have several phone numbers, and each phone number is stored as an area code plus a local number. Phone number is both of which two types of attribute? (e.g. answer: *X and Y*)"
  answers: [multivalued and composite, composite and multivalued, multi-valued and composite, composite and multi-valued, composite multivalued, multivalued composite]
  explanation: "Several per contact (multivalued) and each made of parts (composite): a double oval with its parts hanging off it. The two classifications are independent."

# ---------------------------------------------------------------- Quiz 5 style, Section II: complete the term (recall)

- id: w6-q-term-existence
  type: short
  topics: [er.participation]
  difficulty: 1
  tags: [term]
  prompt: "Total participation is also known as ______."
  answers: [existence dependency, existence-dependency, existence dependence]
  explanation: "And the other way round: existence dependency is total participation, drawn as a double line."

- id: w6-q-term-discriminator
  type: short
  topics: [er.weak]
  difficulty: 1
  tags: [term]
  prompt: "The partial key of a weak entity type is also called its ______."
  answers: [discriminator]
  explanation: "It's drawn with a dashed underline."

- id: w6-q-term-degree
  type: short
  topics: [er.relationships]
  difficulty: 1
  tags: [term]
  prompt: "The number of entity types that participate in a relationship type is its ______."
  answers: [degree, degree of the relationship]
  explanation: "Two makes a binary relationship; a recursive relationship is also binary (two roles)."

- id: w6-q-term-cardinality
  type: short
  topics: [er.cardinality]
  difficulty: 1
  tags: [term]
  prompt: "The structural constraint written as 1:1, 1:N or M:N is the relationship's ______."
  answers: [cardinality ratio, cardinality, multiplicity, relationship multiplicity, cardinality ratio constraint]
  explanation: "The cardinality ratio (also called relationship multiplicity). The other structural constraint is participation."

- id: w6-q-term-identifying
  type: short
  topics: [er.weak]
  difficulty: 1
  tags: [term]
  prompt: "The relationship type that links a weak entity type to its owner is called its ______ relationship."
  answers: [identifying, identifying relationship]
  explanation: "Drawn as a double diamond; the weak entity's participation in it is always total."

# ---------------------------------------------------------------- Quiz 5 style, Section II: cardinality ratios of real relationships

- id: w6-q-ratio-2
  type: matching
  topics: [er.cardinality, er.recursive, er.modeling]
  difficulty: 2
  points: 2
  tags: [ratio-match, quiz-style, trap]
  prompt: "Match the cardinality ratio of each relationship. Cardinality ratios can be 1:1, 1:N or M:N."
  left:
    - "Person and (biological) mother, both PERSON"
    - "Reddit user and the subreddits they join"
    - "Country and its capital city"
  right: ["1:1", "1:N", "M:N"]
  answer: [1, 2, 0]
  explanation: "A mother can have many children, but each person has one biological mother: 1:N, even though it's recursive. Users join many subreddits and subreddits have many users. A country has one capital and a city is the capital of at most one country."

- id: w6-q-ratio-3
  type: matching
  topics: [er.cardinality, er.recursive, er.modeling]
  difficulty: 2
  points: 2
  tags: [ratio-match, quiz-style, trap]
  prompt: "Match the cardinality ratio of each relationship. Cardinality ratios can be 1:1, 1:N or M:N."
  left:
    - "Song and the songs it samples, both SONG"
    - "YouTube channel and the videos uploaded to it"
    - "Person and their current spouse, both PERSON"
  right: ["1:1", "1:N", "M:N"]
  answer: [2, 1, 0]
  explanation: "A song can sample many songs and be sampled by many: M:N, recursive. A channel has many videos; a video is on one channel. A person has at most one current spouse, in both directions."

- id: w6-q-ratio-4
  type: matching
  topics: [er.cardinality, er.recursive, er.modeling]
  difficulty: 2
  points: 2
  tags: [ratio-match, quiz-style]
  prompt: "Match the cardinality ratio of each relationship. Cardinality ratios can be 1:1, 1:N or M:N."
  left:
    - "Employee and the employee who supervises them"
    - "Actor and the movies they appear in"
    - "Car and the licence plate currently on it"
  right: ["1:1", "1:N", "M:N"]
  answer: [1, 2, 0]
  explanation: "A supervisor has many subordinates, each with one supervisor (Supervision, from the lecture). Actors appear in many movies with many actors. A car carries one plate at a time and a plate is on one car."

- id: w6-q-ratio-5
  type: matching
  topics: [er.cardinality, er.recursive, er.modeling]
  difficulty: 2
  points: 2
  tags: [ratio-match, quiz-style, trap]
  prompt: "Match the cardinality ratio of each relationship. Cardinality ratios can be 1:1, 1:N or M:N."
  left:
    - "Instagram account and the accounts it follows"
    - "Instagram account and the posts it publishes"
    - "Hospital patient and the bed they're in right now"
  right: ["1:1", "1:N", "M:N"]
  answer: [2, 1, 0]
  explanation: "Following is recursive and many in both directions: you follow many accounts and many follow you. A post is published by one account; an account publishes many. One bed per patient, one patient per bed."

- id: w6-q-ratio-6
  type: matching
  topics: [er.cardinality, er.recursive, er.modeling]
  difficulty: 2
  points: 2
  tags: [ratio-match, quiz-style, trap]
  prompt: "Match the cardinality ratio of each relationship. Cardinality ratios can be 1:1, 1:N or M:N."
  left:
    - "Program and the programs it was forked from, both GITHUB_REPO (a fork has one parent)"
    - "Student and the classmates they have studied with, both STUDENT"
    - "Department and its current head"
  right: ["1:1", "1:N", "M:N"]
  answer: [1, 2, 0]
  explanation: "A repo can be forked many times, but each fork has one parent: recursive 1:N. Studying together is recursive and many in both directions. A department has one head and a person heads at most one department."
