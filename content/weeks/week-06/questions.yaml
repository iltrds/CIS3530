# ---------------------------------------------------------------- True / False / Maybe on a diagram (worksheet-style, own diagrams)

- id: w6-q-tfm-repair-1
  type: blanks
  topics: [er.reading, er.cardinality, er.participation, er.keys]
  difficulty: 2
  points: 4
  tags: [quiz-style, trap]
  prompt: |
    In context with this diagram, type **True**, **False** or **Maybe** in each box. Maybe means the diagram doesn't show the statement is true, but nothing in it proves the statement false.

    {{er:w6-repair}}
  parts:
    - { text: "A vehicle may have been repaired by several mechanics.", answer: "True" }
    - { text: "A mechanic must have repaired at least one vehicle.", answer: "True" }
    - { text: "A vehicle must be repaired by at least one mechanic.", answer: "False" }
    - { text: "No two vehicles have the same plate.", answer: "Maybe" }
  explanation: "The M next to MECHANIC says a vehicle can be linked to many mechanics. MECHANIC's line to Repairs is double (total), VEHICLE's is single (partial), so only the mechanic \"must\". plate isn't underlined, so the design doesn't require it to be unique, but nothing says two vehicles share one either."

- id: w6-q-tfm-repair-2
  type: blanks
  topics: [er.reading, er.attributes, er.relationships]
  difficulty: 2
  points: 4
  tags: [quiz-style]
  prompt: |
    In context with this diagram, type **True**, **False** or **Maybe** in each box.

    {{er:w6-repair}}
  parts:
    - { text: "name in MECHANIC is a composite attribute.", answer: "True" }
    - { text: "A mechanic can have more than one phone number.", answer: "True" }
    - { text: "make in VEHICLE is a composite attribute.", answer: "False" }
    - { text: "Repairs records one hours value for each mechanic–vehicle pair.", answer: "True" }
  explanation: "name has parts (first, last) hanging off it; phone is a double oval (multivalued); make is a plain oval with no parts. hours is drawn on the Repairs diamond, so it belongs to each mechanic–vehicle pairing."

- id: w6-q-tfm-clinic-1
  type: blanks
  topics: [er.reading, er.weak, er.cardinality, er.participation]
  difficulty: 2
  points: 4
  tags: [quiz-style]
  prompt: |
    In context with this diagram, type **True**, **False** or **Maybe** in each box.

    {{er:w6-clinic}}
  parts:
    - { text: "A visit can exist without a patient.", answer: "False" }
    - { text: "A doctor must attend at least one visit.", answer: "False" }
    - { text: "A visit can be attended by two doctors.", answer: "False" }
    - { text: "Visits of two different patients can have the same visit_date.", answer: "True" }
  explanation: "VISIT is weak (double rectangle) with a double line to its identifying relationship Makes: no patient, no visit. DOCTOR's line to Attends is single, so attending isn't required. The 1 next to DOCTOR means a visit has at most one doctor. visit_date is a partial key: it only has to be unique among one patient's visits."

- id: w6-q-tfm-clinic-2
  type: blanks
  topics: [er.reading, er.weak, er.attributes, er.keys]
  difficulty: 3
  points: 4
  tags: [quiz-style, trap]
