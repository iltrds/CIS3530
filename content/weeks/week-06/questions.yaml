- id: w6-q-abc3-tf-3
  type: true_false
  topics: [er.reading, er.cardinality]
  difficulty: 2
  tags: [er-abc, quiz-style]
  prompt: |
    {{er:w6-abc-3}}

    If B represents CLUBS and C represents EVENTS the clubs host, then this ER model states that an event can be hosted by two clubs. True or false?
  answer: false
