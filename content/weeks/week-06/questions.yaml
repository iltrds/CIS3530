    - { text: "Two visits of the same patient can have the same visit_date.", answer: "False" }
    - { text: "A patient can have several allergies.", answer: "True" }
    - { text: "A patient must have made at least one visit.", answer: "False" }
    - { text: "No two doctors have the same specialty.", answer: "Maybe" }
  explanation: "The partial key (dashed underline) tells apart one owner's weak entities, so one patient can't have two visits with the same visit_date. allergy is a double oval. PATIENT's line to Makes is single (partial). specialty isn't underlined, so uniqueness isn't required, but the diagram can't show it's false."

- id: w6-q-tfm-league-1
