  type: mcq
  topics: [tx.problems]
  difficulty: 1
  style: direct
  prompt: "What is dirty data?"
  options:
    - "Data written by a transaction that hasn't committed yet"
    - "Data that breaks an integrity constraint"
    - "Data that was deleted by a committed transaction"
    - "Data restored from a backup after a crash"
  answer: 0

- id: w10-q-lost-update-other-name
  type: mcq
  topics: [tx.problems]
  difficulty: 1
  style: direct
  prompt: "The lost update problem is also called a:"
  options: ["Write–write conflict", "Read–read conflict", "Phantom write", "Dirty commit"]
  answer: 0

- id: w10-q-phantom-cause
  type: mcq
  topics: [tx.problems]
  difficulty: 2
  tags: [quiz-style, trap]
  prompt: "T1 counts the students in CIS3530 twice and gets 40, then 41. Between the two counts, T2 enrolled a new student and committed. Which problem is this?"
  options: ["Phantom read", "Unrepeatable read", "Dirty read", "Lost update"]
  answer: 0
  explanation: "A new row appeared in the set T1 is reading: a phantom. An unrepeatable read is the same row changing value."

- id: w10-q-unrepeatable-cause
  type: mcq
  topics: [tx.problems]
  difficulty: 2
  tags: [quiz-style, trap]
  prompt: "T1 reads a flight's price twice and gets $310, then $345. In between, T2 updated that flight's price and committed. Which problem is this?"
  options: ["Unrepeatable read", "Phantom read", "Dirty read", "Lost update"]
  answer: 0

- id: w10-q-problems-not-true
  type: mcq
  topics: [tx.problems]
  difficulty: 2
  tags: [quiz-style, negated-stem]
  prompt: "Which of the following is **not true**?"
  options:
    - "A phantom read is caused by another transaction inserting or deleting rows."
    - "A dirty read reads a value written by a transaction that hasn't committed."
    - "A lost update needs both transactions to write the same item."
    - "An unrepeatable read can only happen if the other transaction rolls back."
  answer: 3
  explanation: "An unrepeatable read happens when another transaction updates the item between the two reads, whether or not it later commits. Needing a rollback describes the harmful dirty read."

