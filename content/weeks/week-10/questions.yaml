# Dirty read with a rollback
- id: w10-q-dirty-value
  type: schedule
  topics: [tx.schedules, tx.problems]
  difficulty: 2
  context: dirty-x
  showTime: true
  initial: { X: 150 }
  schedule:
    - "T2: Begin"
    - "T2: Read(X)"
    - "T2: X = X + 60"
    - "T1: Begin | T2: Write(X)"
    - "T1: Read(X)"
    - "T1: X = X - 25 | T2: Rollback"
    - "T1: Write(X)"
    - "T1: Commit"
