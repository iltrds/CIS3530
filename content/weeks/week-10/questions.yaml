# ---------------------------------------------------------------- transactions in Postgres

- id: w10-q-block-error
  type: mcq
  topics: [tx.basics, tx.acid]
  difficulty: 2
  tags: [quiz-style, trap]
  prompt: |
    Table `member(mid PRIMARY KEY, name NOT NULL)` is empty. A user runs:

    ```sql
    BEGIN;
    INSERT INTO member VALUES (10, 'Ana');
    INSERT INTO member VALUES (11, 'Ben');
    INSERT INTO member VALUES (12, NULL);
    END;
    ```

    What does `SELECT * FROM member;` return afterwards?
  options:
    - "No rows"
    - "Ana and Ben"
    - "Ana, Ben and a row for 12 with a null name"
    - "Ana only"
  answer: 0
  explanation: "The third insert breaks NOT NULL. Inside a BEGIN block that dooms the whole transaction: END rolls it back, so Ana and Ben are undone too (atomicity)."

- id: w10-q-autocommit-error
  type: mcq
  topics: [tx.basics]
  difficulty: 2
  tags: [quiz-style, trap]
  prompt: |
    Table `member(mid PRIMARY KEY, name NOT NULL)` is empty. In Postgres, a user runs (no BEGIN):

    ```sql
    INSERT INTO member VALUES (10, 'Ana');
    INSERT INTO member VALUES (11, 'Ben');
    INSERT INTO member VALUES (11, 'Cy');
    ROLLBACK;
    ```

    What does `SELECT * FROM member;` return afterwards?
  options:
    - "No rows: ROLLBACK undoes all three inserts"
    - "Ana and Ben"
    - "Ana, Ben and Cy"
    - "Ana only: ROLLBACK undoes the last successful insert"
  answer: 1
  explanation: "Without BEGIN, each statement is its own transaction and commits when it succeeds. The third fails on its own (duplicate key). ROLLBACK then has nothing to undo; Postgres warns that no transaction is in progress."

- id: w10-q-rows-left
  type: numeric
  topics: [tx.basics]
  difficulty: 2
  prompt: |
    Table `pairs(x, y)` with primary key (x, y) holds 3 rows, including (1, 2). How many rows does it hold after this?

    ```sql
    BEGIN;
    INSERT INTO pairs VALUES (5, 0);
    INSERT INTO pairs VALUES (5, 1);
    COMMIT;
    BEGIN;
    INSERT INTO pairs VALUES (6, 0);
    INSERT INTO pairs VALUES (1, 2);
    INSERT INTO pairs VALUES (6, 1);
    COMMIT;
    INSERT INTO pairs VALUES (7, 0);
    ```
  answer: 6
  explanation: "The first block commits its 2 rows (5). The second block hits a duplicate key at (1, 2), so its COMMIT rolls back and (6, 0) is undone (still 5). The last insert autocommits: 6."

- id: w10-q-commit-then-rollback
  type: mcq
  topics: [tx.basics]
  difficulty: 2
  tags: [quiz-style]
  prompt: |
    Table T is empty.

    ```sql
    BEGIN;
    INSERT INTO T VALUES (1);
    COMMIT;
    BEGIN;
    INSERT INTO T VALUES (2);
    ROLLBACK;
    ```

    Which rows does T hold?
  options: ["1 only", "2 only", "1 and 2", "Neither"]
  answer: 0
  explanation: "The first transaction committed; ROLLBACK only undoes the second, still-open transaction."

- id: w10-q-after-error-ignored
  type: true_false
  topics: [tx.basics]
  difficulty: 2
  tags: [quiz-style, trap]
  prompt: "In Postgres, after one statement inside a BEGIN block fails, the following statements in the block still run, and only the failed statement is undone at COMMIT."
  answer: false
  explanation: "After an error Postgres refuses every further statement (\"current transaction is aborted, commands ignored until end of transaction block\"), and the COMMIT or END rolls the whole block back."

- id: w10-q-each-dml-transaction
  type: true_false
  topics: [tx.basics]
  difficulty: 1
  tags: [quiz-style]
  prompt: "In Postgres, an INSERT run on its own, outside any BEGIN … COMMIT block, is a complete transaction that is committed automatically."
  answer: true
  explanation: "Autocommit: each statement that changes the database is its own transaction."

- id: w10-q-end-means
  type: short
  topics: [tx.basics]
  difficulty: 1
  prompt: "In Postgres, `END;` closes a transaction block. Which other command means exactly the same thing?"
  answers: [COMMIT, "COMMIT;", COMMIT TRANSACTION, COMMIT WORK]
  explanation: "END is Postgres's alternative spelling of COMMIT. (If the block failed, both roll back.)"

- id: w10-q-start-block
  type: short
  topics: [tx.basics]
  difficulty: 1
  prompt: "Which Postgres command starts a transaction block, so that the statements after it are committed or rolled back together?"
  answers: [BEGIN, "BEGIN;", BEGIN TRANSACTION, START TRANSACTION, BEGIN WORK]
  explanation: "BEGIN (or START TRANSACTION)."

- id: w10-q-transaction-def
  type: mcq
  topics: [tx.basics]
  difficulty: 1
  style: direct
  prompt: "Which best describes a transaction?"
  options:
    - "A sequence of one or more changes forming one logical unit of work, applied all together or not at all"
    - "A single SELECT statement"
    - "A backup copy of the database taken at a checkpoint"
    - "Any statement that is guaranteed never to fail"
  answer: 0

- id: w10-q-consistent-during
  type: true_false
  topics: [tx.basics, tx.acid]
  difficulty: 2
  tags: [quiz-style, trap]
  prompt: "A transaction must keep the database in a consistent state at every moment, including between its own steps."
  answer: false
  explanation: "Only before and after. Part way through a transfer, money has left one account and not yet reached the other; that's allowed as long as the transaction finishes (or is fully rolled back)."

# ---------------------------------------------------------------- logs

- id: w10-q-commit-logs
  type: mcq
  topics: [tx.logs]
  difficulty: 2
  tags: [quiz-style]
  prompt: "In the model from class, the transaction's changes are already in the tables and the redo log when it ends. What does COMMIT itself do?"
  options:
    - "Removes the transaction's undo entries"
    - "Copies the redo log into the tables"
    - "Applies the undo entries to the tables"
    - "Deletes the redo log"
  answer: 0
  explanation: "With the undo entries gone, the changes can no longer be reversed: they're permanent. A checkpoint is also logged."

- id: w10-q-rollback-order
  type: order_steps
  topics: [tx.logs]
  difficulty: 2
  prompt: "Put what ROLLBACK does in order."
  items:
    - "Write to the redo log, so the rollback can be reconstructed later"
    - "Apply the undo entries to put the old values back"
    - "Delete the undo entries"
  explanation: "Redo log, apply the undo entries, then throw them away."

- id: w10-q-change-order
  type: order_steps
  topics: [tx.logs]
  difficulty: 2
  prompt: "When a DML statement changes data, put the three places the change is recorded in order."
  items: ["Redo log", "Undo entries", "The database tables"]

- id: w10-q-logs-not-true
  type: mcq
  topics: [tx.logs, tx.acid]
  difficulty: 2
  tags: [quiz-style, negated-stem]
  prompt: "Which of the following is **not true**?"
  options:
    - "Undo entries hold the old values, so a change can be reversed."
    - "The redo log lets committed changes be replayed after a failure."
    - "After a crash, work after the last checkpoint is recovered with the redo and undo logs."
    - "A committed change can still be reversed with ROLLBACK as long as its redo log entry exists."
  answer: 3
  explanation: "Once committed, the undo entries are gone and ROLLBACK only affects an open transaction. The other three are true."

# ---------------------------------------------------------------- ACID

- id: w10-q-acid-letters
  type: blanks
  topics: [tx.acid]
  difficulty: 1
  style: direct
  strictCase: false
  prompt: "What does each letter of ACID stand for?"
  parts:
    - { text: "A", answer: Atomicity }
    - { text: "C", answer: Consistency, accept: [Consistency preservation] }
    - { text: "I", answer: Isolation }
    - { text: "D", answer: Durability, accept: [Permanency, Durability or permanency] }

- id: w10-q-acid-match
  type: matching
  topics: [tx.acid]
  difficulty: 1
  points: 2
  tags: [tx-match, quiz-style]
  prompt: "Match each description to the ACID property."
  left:
    - "A transaction runs completely or not at all"
    - "A transaction can't leave the database breaking its integrity constraints"
    - "A transaction behaves as if no other transaction were running"
    - "Once committed, the changes survive a crash"
  right: [Atomicity, Consistency, Isolation, Durability]
  answer: [0, 1, 2, 3]

- id: w10-q-acid-scenarios
  type: matching
  topics: [tx.acid]
  difficulty: 2
  points: 2
  tags: [tx-match, quiz-style]
  prompt: "Each scenario breaks one ACID property. Match them."
  left:
    - "The server crashes a second after a transfer was committed, and on restart the transfer is gone."
    - "A transfer takes money out of A, then fails; the money never reaches B and isn't put back into A."
    - "While T1 is half-way through a transfer, T2 reads both balances and reports a total that's $100 short."
    - "A transaction leaves an order line pointing at a product that doesn't exist."
  right: [Durability, Atomicity, Isolation, Consistency]
  answer: [0, 1, 2, 3]

- id: w10-q-component
  type: matching
  topics: [tx.acid]
  difficulty: 2
  points: 2
  tags: [tx-match, quiz-style]
  prompt: "Match each DBMS component or mechanism with the property it is there to provide."
  left: ["Concurrency control unit", "Recovery manager (roll forward and roll back)", "Rolling back every statement after an error in the block", "Primary key, foreign key and CHECK constraints"]
  right: [Isolation, Durability, Atomicity, Consistency]
  answer: [0, 1, 2, 3]

- id: w10-q-isolation-restaurant
  type: mcq
  topics: [tx.acid]
  difficulty: 1
  tags: [quiz-style]
  prompt: "Your meal at a busy restaurant is the same as if you were the only diner. Which ACID property is this an analogy for?"
  options: [Atomicity, Consistency, Isolation, Durability]
  answer: 2

- id: w10-q-pk-violation-property
  type: mcq
  topics: [tx.acid, tx.basics]
  difficulty: 2
  tags: [quiz-style]
  prompt: "A transaction of four INSERTs is rolled back because the third breaks the primary key, so the table is exactly as it was before. Which two properties does this show?"
  options:
    - "Atomicity and consistency"
    - "Isolation and durability"
    - "Durability and atomicity"
    - "Consistency and isolation"
  answer: 0
  explanation: "All or nothing (atomicity), and the key constraint is never broken (consistency)."

- id: w10-q-acid-not-true
  type: mcq
  topics: [tx.acid]
  difficulty: 2
  tags: [quiz-style, negated-stem, all-none-option]
  prompt: "Which of the following is **not true**?"
  options:
    - "Durability means a committed change stays even if the system fails."
    - "Isolation is looked after by the concurrency control unit."
    - "Atomicity means a transaction is performed entirely or not at all."
    - "None of the given choices"
  answer: 3
  explanation: "All three statements are true, so the answer is None."

# ---------------------------------------------------------------- concurrency basics

- id: w10-q-interleaved-parallel
  type: mcq
  topics: [tx.concurrency]
  difficulty: 1
  tags: [quiz-style]
  prompt: "A server with one CPU runs part of transaction A, switches to B, back to A, then finishes B. This is:"
  options: ["Interleaved processing", "Parallel processing", "Serial processing", "Distributed processing"]
  answer: 0
  explanation: "One CPU taking turns is interleaving; parallel processing needs several CPUs running at the same time."

- id: w10-q-multiuser
  type: mcq
  topics: [tx.concurrency]
  difficulty: 1
  style: direct
  prompt: "Which is an example of a multiuser DBMS from class?"
  options: ["An airline reservation system", "A database on a home computer", "A spreadsheet open on one laptop", "A printed report"]
  answer: 0

- id: w10-q-data-item
  type: multi
  topics: [tx.concurrency]
  difficulty: 1
  style: direct
  prompt: "Which can be a data item in transaction processing?"
  options: ["A record", "A disk block", "One attribute value of a record", "None of the given choices"]
  answer: [0, 1, 2]
  explanation: "Any of them; the theory doesn't depend on the item's size."

- id: w10-q-assign-no-change
  type: true_false
  topics: [tx.concurrency]
  difficulty: 2
  tags: [quiz-style, trap]
  prompt: "After `Read(A); A = A - 50;` the database item A has already decreased by 50."
  answer: false
  explanation: "The subtraction happens on the transaction's program variable. The database changes only at Write(A)."

- id: w10-q-write-def
  type: mcq
  topics: [tx.concurrency]
  difficulty: 1
  style: direct
  prompt: "What does Write(X) do?"
  options:
    - "Copies the program variable X into the database item X"
    - "Copies the database item X into the program variable X"
    - "Commits the transaction"
    - "Locks X so no other transaction can read it"
  answer: 0

- id: w10-q-valid-schedule
  type: mcq
  topics: [tx.concurrency]
  difficulty: 2
  tags: [quiz-style]
  prompt: |
    T1 is `Read(A), Write(A), Read(B), Write(B)` and T2 is `Read(B), Write(B)`. Which of these is **not** a valid schedule of T1 and T2?
  options:
    - "T1: Read(A), T2: Read(B), T1: Write(A), T2: Write(B), T1: Read(B), T1: Write(B)"
    - "T2: Read(B), T2: Write(B), T1: Read(A), T1: Write(A), T1: Read(B), T1: Write(B)"
    - "T1: Read(A), T1: Read(B), T1: Write(A), T2: Read(B), T2: Write(B), T1: Write(B)"
    - "T1: Read(A), T1: Write(A), T1: Read(B), T1: Write(B), T2: Read(B), T2: Write(B)"
  answer: 2
  explanation: "A schedule may interleave transactions but must keep each one's own operations in order. Option c runs T1's Read(B) before its Write(A)."

- id: w10-q-serial-orders
  type: true_false
  topics: [tx.schedules]
  difficulty: 2
  tags: [quiz-style, trap]
  prompt: "Running T1 then T2 and running T2 then T1 must give the same final values; if they don't, one of the orders is wrong."
  answer: false
  explanation: "Serial orders can give different values (for example, take 20% of A before or after a $100 transfer). Each serial order is considered correct."

