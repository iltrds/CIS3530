- id: w10-q-dirty-should
  type: numeric
  topics: [tx.schedules, tx.problems]
  difficulty: 2
  prompt: "X = 150. T2 reads X, adds 60 and writes it, then rolls back. T1 subtracts 25 from X and commits. Since T2 rolled back, it should have no effect at all. What *should* X be at the end?"
  answer: 125
  explanation: "Only T1's change counts: 150 − 25 = 125. If T1 read T2's uncommitted 210 (a dirty read), it would write 185 instead."

