# Schedules that are fine
- id: w10-q-clean
  type: schedule
  topics: [tx.problems, tx.schedules]
  difficulty: 2
  initial: { A: 50, B: 70 }
  schedule:
    - "T1: Read(A)"
    - "T1: A = A - 10"
    - "T1: Write(A)"
    - "T2: Read(B)"
    - "T2: B = B * 2"
    - "T2: Write(B)"
    - "T1: Read(B)"
    - "T1: B = B + 10"
    - "T1: Write(B)"
    - "T1: Commit"
    - "T2: Commit"
  mode: problem
  tags: [trap]
  explanation: "T2 touches only B before T1 reads it, and nobody reads or overwrites anything they shouldn't. The result equals T2 then T1."

