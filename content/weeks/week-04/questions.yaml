  topics: [sql.group-by]
  difficulty: 1
  dataset: supplier-parts
  show: { tables: [SP] }
  sql: |
    SELECT pno, COUNT(*)
    FROM SP
    GROUP BY pno;
  distractors: [[2, 12], [1, 6], [2, 5], [2, 1]]
  explanation: "One row per group, and every part from P1 to P6 appears in SP."

