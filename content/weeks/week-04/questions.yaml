    SELECT sno, COUNT(pno)
    FROM SP
    WHERE qty >= 200
    GROUP BY sno
    HAVING COUNT(pno) > 1;
  answerIsNone: true
  distractors: [[2, 3], [2, 5], [1, 2], [2, 1]]
