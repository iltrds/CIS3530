- id: w4-q-shape-num-den
  type: query_shape
  topics: [sql.division]
  difficulty: 3
  dataset: num-den
  show: { tables: [num, den] }
  sql: |
    SELECT DISTINCT A
    FROM num N1
    WHERE NOT EXISTS (SELECT *
                      FROM den
                      WHERE NOT EXISTS (SELECT *
                                        FROM num N2
                                        WHERE N2.A = N1.A
                                          AND N2.B = den.C));
  distractors: [[1, 0], [1, 4], [2, 1], [1, 3]]
  explanation: "This is NUM ÷ DEN: only A = 1 appears with every C (2, 3 and 4)."

# ---------------------------------------------------------------- SQL quiz format: valid and equivalent queries

- id: w4-q-choices-total-per-part
  type: query_choices
  topics: [sql.group-by]
  difficulty: 1
  dataset: supplier-parts
  prompt: Which query lists each part number with the total quantity shipped of that part?
  reference: SELECT pno, SUM(qty) FROM SP GROUP BY pno;
  candidates:
    - query: |
        SELECT pno, SUM(qty)
        FROM SP
        GROUP BY pno;
    - query: |
        SELECT pno, SUM(qty)
        FROM SP;
      why: Without GROUP BY there's one row, so pno can't be shown.
    - query: |
        SELECT pno, SUM(qty)
        FROM SP
        GROUP BY sno;
      why: The groups are suppliers, and pno isn't a grouping attribute.
    - query: |
        SELECT pno, qty
        FROM SP
        GROUP BY pno;
      why: qty is neither grouped nor aggregated.
    - query: |
        SELECT pno, COUNT(qty)
        FROM SP
        GROUP BY pno;
      why: COUNT counts shipments; it doesn't add up quantities.

- id: w4-q-choices-more-than-one
  type: query_choices
  topics: [sql.having, sql.correlated, sql.joins]
  difficulty: 2
  dataset: supplier-parts
  multi: true
  prompt: Which queries list the numbers of the parts supplied by more than one supplier? **Select all choices that apply.**
  reference: SELECT pno FROM SP GROUP BY pno HAVING COUNT(*) > 1;
  candidates:
    - query: |
        SELECT pno
        FROM SP
        GROUP BY pno
        HAVING COUNT(sno) > 1;
    - query: |
        SELECT pno
        FROM SP
        WHERE COUNT(*) > 1
        GROUP BY pno;
      why: A condition on a count of rows belongs in HAVING.
    - query: |
        SELECT DISTINCT SP1.pno
        FROM SP SP1, SP SP2
        WHERE SP1.pno = SP2.pno
          AND SP1.sno <> SP2.sno;
      why: Two different shipments of the same part means two different suppliers.
    - query: |
        SELECT pno, COUNT(*)
        FROM SP
        GROUP BY pno
        HAVING COUNT(*) > 1;
      why: It also returns the count.
    - query: |
        SELECT pno
        FROM SP
        GROUP BY pno
        HAVING COUNT(*) > 2;
      why: "> 2 means at least three suppliers."
    - query: |
        SELECT pno
        FROM P
        WHERE EXISTS (SELECT *
                      FROM SP X
                      WHERE X.pno = P.pno
                        AND EXISTS (SELECT *
                                    FROM SP Y
                                    WHERE Y.pno = P.pno
                                      AND Y.sno <> X.sno));

- id: w4-q-choices-largest
  type: query_choices
  topics: [sql.aggregates, sql.subqueries, sql.having]
  difficulty: 2
  dataset: supplier-parts
  prompt: Which query lists the supplier numbers of the suppliers who made the single largest shipment?
  reference: SELECT sno FROM SP WHERE qty = (SELECT MAX(qty) FROM SP);
  candidates:
    - query: |
        SELECT sno
        FROM SP
        WHERE qty = MAX(qty);
      why: Aggregates aren't allowed in WHERE.
    - query: |
        SELECT sno, MAX(qty)
        FROM SP;
      why: sno isn't grouped or aggregated.
    - query: |
        SELECT sno
        FROM SP
        GROUP BY sno
        HAVING MAX(qty) = MAX(qty);
      why: The condition is always true, so every supplier qualifies.
    - query: |
        SELECT sno
        FROM SP
        WHERE qty IN (SELECT MAX(qty)
                      FROM SP);
    - query: |
        SELECT sno
        FROM SP
        ORDER BY qty DESC;
      why: Sorting doesn't remove any rows.

- id: w4-q-choices-exists-rewrite
  type: query_choices
  topics: [sql.correlated, sql.subqueries]
  difficulty: 2
  dataset: supplier-parts
  prompt: |
    Which query returns the same result as this one, using EXISTS?
    ```sql
    SELECT sname
    FROM S
    WHERE sno IN (SELECT sno
                  FROM SP
                  WHERE pno = 'P5');
    ```
  reference: SELECT sname FROM S WHERE sno IN (SELECT sno FROM SP WHERE pno = 'P5');
  candidates:
    - query: |
        SELECT sname
        FROM S
        WHERE EXISTS (SELECT *
                      FROM SP
                      WHERE SP.sno = S.sno
                        AND pno = 'P5');
    - query: |
        SELECT sname
        FROM S
        WHERE EXISTS (SELECT *
                      FROM SP
                      WHERE pno = 'P5');
      why: Without SP.sno = S.sno the subquery doesn't depend on the supplier, so it's true for everyone.
    - query: |
        SELECT sname
        FROM S
        WHERE NOT EXISTS (SELECT *
                          FROM SP
                          WHERE SP.sno = S.sno
                            AND pno <> 'P5');
      why: This finds suppliers whose every shipment is P5, including suppliers with no shipments at all.
    - query: |
        SELECT sname
        FROM S, SP
        WHERE EXISTS (SELECT *
                      FROM SP
                      WHERE SP.sno = S.sno
                        AND pno = 'P5');
      why: The outer FROM S, SP repeats each supplier once per shipment in SP.

- id: w4-q-choices-not-p4
  type: query_choices
  topics: [sql.correlated, sql.subqueries]
  difficulty: 2
  tags: [trap]
  dataset: supplier-parts
  prompt: Which query lists the names of suppliers who do **not** supply part P4?
  reference: SELECT sname FROM S WHERE sno NOT IN (SELECT sno FROM SP WHERE pno = 'P4');
  candidates:
    - query: |
        SELECT sname
        FROM S
        WHERE NOT EXISTS (SELECT *
                          FROM SP
                          WHERE SP.sno = S.sno
                            AND SP.pno = 'P4');
    - query: |
        SELECT sname
        FROM S, SP
        WHERE S.sno = SP.sno
          AND pno <> 'P4';
      why: "This lists suppliers with some other part, once per shipment, and drops HENRY, who has no shipments."
    - query: |
        SELECT DISTINCT sname
        FROM S NATURAL JOIN SP
        WHERE pno <> 'P4';
      why: Suppliers of P4 who also ship other parts still appear.
    - query: |
        SELECT sname
        FROM S
        WHERE NOT EXISTS (SELECT *
                          FROM SP
                          WHERE pno = 'P4');
      why: Not correlated. Someone ships P4, so NOT EXISTS is false for every supplier.

- id: w4-q-choices-every-blue
  type: query_choices
  topics: [sql.division, sql.correlated, sql.having]
  difficulty: 3
  dataset: supplier-parts
  multi: true
  prompt: Which queries list the names of suppliers who supply **every** BLUE part? **Select all choices that apply.**
  reference: |
    SELECT sname FROM S
    WHERE NOT EXISTS (SELECT * FROM P WHERE color = 'BLUE'
                      AND NOT EXISTS (SELECT * FROM SP WHERE SP.sno = S.sno AND SP.pno = P.pno));
  candidates:
    - query: |
        SELECT sname
        FROM S
        WHERE NOT EXISTS (SELECT *
                          FROM P
                          WHERE color = 'BLUE'
                            AND NOT EXISTS (SELECT *
                                            FROM SP
                                            WHERE SP.sno = S.sno
                                              AND SP.pno = P.pno));
    - query: |
        SELECT sname
        FROM S
        WHERE sno IN (SELECT sno
                      FROM SP
                      WHERE pno IN (SELECT pno FROM P WHERE color = 'BLUE')
                      GROUP BY sno
                      HAVING COUNT(pno) = (SELECT COUNT(*) FROM P WHERE color = 'BLUE'));
    - query: |
        SELECT sname
        FROM S
        WHERE sno IN (SELECT sno
                      FROM SP
                      GROUP BY sno
                      HAVING COUNT(pno) = (SELECT COUNT(*) FROM P WHERE color = 'BLUE'));
      why: This counts all of a supplier's parts, so it finds suppliers with exactly as many parts as there are blue parts.
    - query: |
        SELECT DISTINCT sname
        FROM S NATURAL JOIN SP
        WHERE pno IN (SELECT pno FROM P WHERE color = 'BLUE');
      why: That's at least one blue part, not every one.
    - query: |
        SELECT sname
        FROM S
        WHERE sno IN (SELECT sno FROM SP WHERE pno = 'P3')
          AND sno IN (SELECT sno FROM SP WHERE pno = 'P5');
      why: Naming today's blue parts stops working once another blue part is added.

- id: w4-q-choices-num-den
  type: query_choices
  topics: [sql.division]
  difficulty: 3
  dataset: num-den
  show: { tables: [num, den] }
  multi: true
  prompt: Which SQL queries compute NUM ÷ DEN, the values of A that appear with every C? **Select all choices that apply.**
  reference: |
    SELECT DISTINCT A FROM num N1
    WHERE NOT EXISTS (SELECT * FROM den
                      WHERE NOT EXISTS (SELECT * FROM num N2 WHERE N2.A = N1.A AND N2.B = den.C));
  candidates:
    - query: |
        SELECT DISTINCT A
        FROM num N1
        WHERE NOT EXISTS (SELECT *
                          FROM den
                          WHERE NOT EXISTS (SELECT *
                                            FROM num N2
                                            WHERE N2.A = N1.A
                                              AND N2.B = den.C));
    - query: |
        SELECT A
        FROM num N1
        WHERE NOT EXISTS (SELECT *
                          FROM den
                          WHERE NOT EXISTS (SELECT *
                                            FROM num N2
                                            WHERE N2.A = N1.A
                                              AND N2.B = den.C));
      why: Each qualifying A appears once per row of NUM.
    - query: |
        SELECT A
        FROM num
        WHERE B IN (SELECT C FROM den)
        GROUP BY A
        HAVING COUNT(DISTINCT B) = (SELECT COUNT(*) FROM den);
    - query: |
        SELECT A
        FROM num
        GROUP BY A
        HAVING COUNT(B) = (SELECT COUNT(*) FROM den);
      why: "COUNT(B) counts repeated rows and B values that aren't in DEN."
    - query: |
        SELECT DISTINCT A
        FROM num N1
        WHERE EXISTS (SELECT *
                      FROM den
                      WHERE den.C = N1.B);
      why: That's "at least one C", not every one.

- id: w4-q-choices-delete
  type: query_choices
  topics: [sql.modify, integrity.referential, integrity.entity]
  difficulty: 2
  dataset: supplier-parts
  prompt: Which statement removes all of supplier S2's shipments (and nothing else)?
  reference: DELETE FROM SP WHERE sno = 'S2';
  check: SELECT * FROM SP;
  candidates:
    - query: DELETE FROM SP WHERE sno = 'S2';
    - query: DELETE FROM S WHERE sno = 'S2';
      why: S2 still has shipments, so deleting the supplier breaks referential integrity.
    - query: DELETE FROM SP;
      why: No WHERE deletes every shipment.
    - query: DELETE sno FROM SP WHERE sno = 'S2';
      why: DELETE removes whole rows; it takes no column list.
    - query: UPDATE SP SET sno = NULL WHERE sno = 'S2';
      why: sno is part of SP's primary key, so it can't be null (entity integrity).

- id: w4-q-choices-update
  type: query_choices
  topics: [sql.modify]
  difficulty: 2
  dataset: supplier-parts
  multi: true
  prompt: Which statements change every shipment quantity of 100 to 150, and change nothing else? **Select all choices that apply.**
  reference: UPDATE SP SET qty = 150 WHERE qty = 100;
  check: SELECT * FROM SP;
  candidates:
    - query: UPDATE SP SET qty = 150 WHERE qty = 100;
    - query: UPDATE SP SET qty = 150;
      why: No WHERE updates every row.
    - query: UPDATE SP SET qty = qty + 50 WHERE qty = 100;
    - query: UPDATE SP WHERE qty = 100 SET qty = 150;
      why: SET comes before WHERE.
    - query: INSERT INTO SP (SELECT sno, pno, 150 FROM SP WHERE qty = 100);
      why: INSERT adds rows, and these would repeat existing (sno, pno) keys.
    - query: UPDATE SP SET qty = 150 WHERE qty < 150;
      why: Here the only quantities under 150 happen to be 100, but any shipment of 120 would change too.

