# ---------------------------------------------------------------- concepts

- id: w4-q-groupby-select
  type: multi
  topics: [sql.group-by]
  difficulty: 1
  prompt: "A query has `GROUP BY sno` on table SP(sno, pno, qty). Which may appear in its SELECT list? Select all that apply."
  options: [sno, pno, "COUNT(pno)", qty, "MAX(qty)"]
  answer: [0, 2, 4]
  explanation: Only grouping attributes and aggregates. pno and qty differ within a group.

- id: w4-q-where-having
  type: mcq
  topics: [sql.having]
  difficulty: 1
  tags: [quiz-style]
  prompt: Which clause keeps or discards whole groups after grouping?
  options: [WHERE, HAVING, ORDER BY, GROUP BY, None of the given choices]
  answer: 1
  explanation: WHERE filters rows before grouping; HAVING filters groups after.

- id: w4-q-not-true-groupby
  type: mcq
  topics: [sql.group-by, sql.having]
  difficulty: 2
  tags: [negated-stem, quiz-style]
  prompt: Which of the following is **not true**?
  options:
    - An aggregate without GROUP BY returns one row.
    - HAVING can use aggregate functions.
    - WHERE can use aggregate functions if GROUP BY is present.
    - GROUP BY produces one result row per group.
    - None of the given choices
  answer: 2
  explanation: Aggregates are never allowed in WHERE; that's what HAVING (or a subquery) is for.

- id: w4-q-order-clauses
  type: order_steps
  topics: [sql.clause-order]
  difficulty: 1
  prompt: Put the clauses in the order they're written in a query.
  items: [SELECT, FROM, WHERE, GROUP BY, HAVING, ORDER BY]

- id: w4-q-order-eval
  type: order_steps
