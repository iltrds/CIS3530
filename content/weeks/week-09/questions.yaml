- id: w9-q-sql-function
  type: sql
  topics: [ddl.functions]
  difficulty: 3
  dataset: supplier-parts
  show: { tables: [SP] }
  prompt: "Write a PL/pgSQL function total_qty(s_no VARCHAR) that returns the total quantity a supplier ships (null if none)."
  reference: |
    CREATE OR REPLACE FUNCTION total_qty(s_no VARCHAR)
    RETURNS INTEGER
    LANGUAGE plpgsql
    AS $$
    DECLARE
      t INTEGER;
    BEGIN
      SELECT SUM(qty) INTO t FROM SP WHERE sno = s_no;
      RETURN t;
    END;
    $$;
  check: "SELECT sno, total_qty(sno) AS total FROM S ORDER BY sno;"
  explanation: "The check calls your function for every supplier and compares the totals."

- id: w9-q-sql-trigger
  type: sql
  topics: [ddl.triggers]
  difficulty: 3
  dataset: supplier-parts
  show: { tables: [S] }
  prompt: "Create an empty table S_after_delete with S's columns, then write the trigger function save_old() and an AFTER DELETE … FOR EACH ROW trigger on S that copies each deleted supplier into S_after_delete. (The check then deletes S5 and S6.)"
  reference: |
    CREATE TABLE S_after_delete AS SELECT * FROM S WHERE 1 = 2;
    CREATE OR REPLACE FUNCTION save_old()
    RETURNS TRIGGER
    LANGUAGE plpgsql
    AS $$
    BEGIN
      INSERT INTO S_after_delete VALUES (OLD.sno, OLD.sname, OLD.status, OLD.city);
      RETURN OLD;
    END;
    $$;
    CREATE TRIGGER save_on_delete AFTER DELETE ON S FOR EACH ROW EXECUTE FUNCTION save_old();
  check: "DELETE FROM SP WHERE sno IN ('S5', 'S6'); DELETE FROM S WHERE sno IN ('S5', 'S6'); SELECT * FROM S_after_delete ORDER BY sno;"
  hints:
    - "CREATE TABLE S_after_delete AS SELECT * FROM S WHERE 1 = 2; makes the empty table."
    - "In a DELETE trigger the row is in OLD."
  explanation: "OLD holds the deleted row. S5 has shipments, so the check deletes them from SP first (the foreign key would refuse otherwise)."

