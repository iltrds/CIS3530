# ---------------------------------------------------------------- which statements run? (computed by running each one in Postgres)

- id: w9-q-runs-drop
  type: sql_runs
  topics: [ddl.drop, ddl.truncate]
  difficulty: 2
  dataset: supplier-parts
  show: { diagram: true }
  tags: [quiz-style]
  prompt: "SP has foreign keys on S and P. Starting from this database each time, which of these statements run without an error?"
  candidates:
    - sql: DROP TABLE SP;
    - sql: DROP TABLE S;
      why: "SP's foreign key depends on S, and RESTRICT is the default."
    - sql: DROP TABLE S CASCADE;
      why: "CASCADE drops SP's foreign key along with S; SP stays."
    - sql: TRUNCATE TABLE S;
      why: "S is referenced by a foreign key, so TRUNCATE needs SP listed too, or CASCADE."
    - sql: DELETE FROM SP WHERE qty > 100;

- id: w9-q-runs-alter
  type: sql_runs
  topics: [ddl.alter, ddl.constraints]
  difficulty: 3
  dataset: ddl-company
  show: { tables: [EMP] }
  tags: [quiz-style, trap]
  prompt: "EMP already has the rows shown. Which of these ALTER TABLE statements run without an error?"
  candidates:
    - sql: ALTER TABLE EMP ADD bonus INTEGER;
    - sql: ALTER TABLE EMP ADD bonus INTEGER NOT NULL;
      why: "The new column would be null in every existing row."
    - sql: ALTER TABLE EMP ADD CONSTRAINT pos_sal CHECK (salary > 0);
    - sql: ALTER TABLE EMP ADD CONSTRAINT big_sal CHECK (salary > 60000);
      why: "Eve's salary of 52000 already breaks it."
    - sql: ALTER TABLE EMP ADD CONSTRAINT one_per_dept UNIQUE (dno);
      why: "Several employees already share a department."

- id: w9-q-runs-create
  type: sql_runs
  topics: [ddl.create, ddl.constraints]
  difficulty: 2
  dataset: supplier-parts
  tags: [quiz-style, trap]
  prompt: "In the supplier–parts database (S.sno is text), which of these CREATE TABLE statements run without an error?"
  candidates:
    - sql: CREATE TABLE T (a INT PRIMARY KEY, b INT PRIMARY KEY);
      why: "A table has one primary key; a composite key is written PRIMARY KEY (a, b)."
    - sql: CREATE TABLE T (a INT, b INT, PRIMARY KEY (a, b));
    - sql: CREATE TABLE T (a INT REFERENCES S (sno));
      why: "A foreign key must have a type compatible with the key it references; sno is text."
    - sql: CREATE TABLE T (a VARCHAR(5) REFERENCES S (sno), b INT CHECK (b > 0));
    - sql: CREATE TABLE T (a INT NOT NULL UNIQUE);

- id: w9-q-runs-test
  type: sql_runs
  topics: [ddl.constraints]
  difficulty: 3
  dataset: supplier-parts
  tags: [quiz-style, trap]
  setup: "CREATE TABLE TEST (ATTR1 NUMERIC CHECK (ATTR1 > 0), ATTR2 VARCHAR(2) UNIQUE);"
  prompt: "TEST is created with a CHECK and a UNIQUE constraint. Which of these inserts run without an error?"
  candidates:
    - sql: INSERT INTO TEST VALUES (5, 'ab');
    - sql: INSERT INTO TEST VALUES (-1, 'cd');
    - sql: INSERT INTO TEST VALUES (3, 'abc');
      why: "VARCHAR(2) holds at most two characters."
    - sql: INSERT INTO TEST VALUES (NULL, NULL);
      why: "A CHECK only refuses rows where the condition is false; NULL > 0 is unknown, not false. UNIQUE allows nulls."
    - sql: INSERT INTO TEST VALUES (2, 'ab'), (4, 'ab');
      why: "The two rows clash on the UNIQUE column."

- id: w9-q-runs-ctas
  type: sql_runs
  topics: [ddl.copy, ddl.constraints]
  difficulty: 2
  dataset: supplier-parts
  tags: [quiz-style]
  setup: "CREATE TABLE S2 AS SELECT * FROM S;"
  select: fails
  multi: false
  prompt: "S2 is a copy of S made with CREATE TABLE … AS. Which of these statements does Postgres refuse?"
  candidates:
    - sql: INSERT INTO S2 SELECT * FROM S;
      why: "S2 has no primary key, so duplicates are fine."
    - sql: INSERT INTO S SELECT * FROM S2;
      why: "S still has its primary key, and every sno is already there."
    - sql: INSERT INTO S2 VALUES (NULL, 'NOBODY', 10, 'OTTAWA');
      why: "No key on S2 means a null sno is allowed too."
    - sql: ALTER TABLE S2 ADD PRIMARY KEY (sno);
      why: "The copy has no duplicate or null sno yet, so the key can be added."

- id: w9-q-runs-truncate
  type: sql_runs
  topics: [ddl.truncate]
  difficulty: 2
  dataset: supplier-parts
  tags: [quiz-style]
  select: fails
  prompt: "SP has a foreign key on S. Which of these statements does Postgres refuse?"
  candidates:
    - sql: TRUNCATE TABLE SP;
    - sql: TRUNCATE TABLE S;
    - sql: TRUNCATE TABLE S, SP;
    - sql: TRUNCATE TABLE S CASCADE;
    - sql: TRUNCATE TABLE SP WHERE qty > 100;
      why: "TRUNCATE has no WHERE clause; that's what DELETE is for."

- id: w9-q-runs-trigger
  type: sql_runs
  topics: [ddl.triggers, ddl.functions]
  difficulty: 3
  dataset: supplier-parts
  tags: [quiz-style, trap]
  setup: "CREATE TABLE log_t (sno VARCHAR(5));"
  prompt: "Which of these run without an error?"
  candidates:
    - sql: CREATE TRIGGER t AFTER INSERT ON S FOR EACH ROW EXECUTE FUNCTION no_such_function();
      why: "The trigger function has to exist first."
    - sql: |
        CREATE FUNCTION log_it() RETURNS TRIGGER LANGUAGE plpgsql AS $$
        BEGIN INSERT INTO log_t VALUES (NEW.sno); RETURN NEW; END; $$;
    - sql: |
        CREATE FUNCTION log_it(s VARCHAR) RETURNS TRIGGER LANGUAGE plpgsql AS $$
        BEGIN INSERT INTO log_t VALUES (s); RETURN NEW; END; $$;
      why: "A trigger function can't declare parameters; it reads the row from NEW and OLD."
    - sql: |
        CREATE FUNCTION log_it() RETURNS TRIGGER LANGUAGE plpgsql AS $$
        BEGIN INSERT INTO log_t VALUES (OLD.sno); RETURN OLD; END; $$;
        CREATE TRIGGER t AFTER DELETE ON S FOR EACH ROW EXECUTE FUNCTION log_it();

