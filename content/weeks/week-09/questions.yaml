    CREATE TRIGGER t BEFORE INSERT ON S FOR EACH ROW EXECUTE FUNCTION skip_athens();
    INSERT INTO S VALUES ('S7', 'PAPPAS', 10, 'ATHENS'), ('S8', 'NG', 30, 'GUELPH');
  sql: SELECT * FROM S;
  distractors: [[4, 8], [4, 6], [5, 7]]
