# Week 1 question bank. Quiz-style items copy the format of the in-class quizzes
# (negated stems, "All/None of the given choices", matching, True/False fill-ins).

- id: w1-q-not-true-relation
  type: mcq
  topics: [rm.properties]
  difficulty: 1
  tags: [negated-stem, quiz-style]
  prompt: Which of the following is **not true** about a relation?
  options:
    - Each cell holds exactly one atomic value.
    - The order of the tuples has no significance.
    - Two attributes of the same relation may share a name.
    - No two tuples are identical.
    - None of the given choices
  answer: 2
  explanation: Attribute names must be distinct within a relation. The other three statements are properties of every relation.

- id: w1-q-not-true-relation-2
  type: mcq
  topics: [rm.properties]
  difficulty: 1
  tags: [negated-stem, quiz-style]
  prompt: Which of the following is **not true** about a relation?
  options:
    - A relation is a set of tuples.
    - The order of attributes has no significance.
    - All values of an attribute come from the same domain.
    - A cell may hold a list of values if they share a domain.
    - None of the given choices
  answer: 3
  explanation: Every cell holds a single atomic value. A list in one cell breaks that property no matter what the domain is.

- id: w1-q-synonym-attribute
  type: mcq
  style: direct
  topics: [rm.terminology]
  difficulty: 1
  tags: [terminology, quiz-style, trap]
  prompt: Which of the following terms means the same as "attribute" in a relation?
  options:
    - Row
    - Column
    - Table
    - Tuple
    - None of the given choices
  answer: 1
  explanation: An attribute is a column. A tuple is a row, and a relation is a table.

- id: w1-q-synonym-relation
  type: mcq
  style: direct
  topics: [rm.terminology]
  difficulty: 1
  tags: [terminology, quiz-style]
  prompt: Which of the following terms means the same as "relation"?
  options:
    - Field
    - Record
    - Table
    - Domain
    - None of the given choices
  answer: 2
  explanation: A relation is a table. A record is a row (tuple), a field is a column (attribute), and a domain is the set of allowed values for an attribute.

- id: w1-q-synonym-cardinality
  type: mcq
  style: direct
  topics: [rm.terminology]
  difficulty: 1
  tags: [terminology, quiz-style]
  prompt: The number of tuples in a relation is called its…
  options:
    - degree
    - arity
    - cardinality
    - domain
    - None of the given choices
  answer: 2
  explanation: Cardinality counts tuples (rows). Degree, also called arity, counts attributes (columns).

- id: w1-q-degree-s
  type: numeric
  style: direct
  topics: [rm.terminology]
  difficulty: 1
  dataset: supplier-parts-w1
  show: { tables: [S] }
  prompt: What is the **degree** of relation S?
  answer: 4
