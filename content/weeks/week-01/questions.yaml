- id: w1-q-cardinality-sp
  type: numeric
  style: direct
  topics: [rm.terminology]
  difficulty: 1
  dataset: supplier-parts-w1
  show: { tables: [SP] }
  prompt: What is the **cardinality** of relation SP in this instance?
