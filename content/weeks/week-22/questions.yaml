- id: le2-q-null-trap
  type: query_choices
  topics: [lab.le2, sql.subqueries]
  difficulty: 3
  dataset: lab-le2
  multi: true
  show: { tables: [Movie] }
  tags: [trap]
  prompt: "We want the titles of movies whose director did not direct any movie released before 1980. A movie with no director counts (there's no director who did). Which queries give exactly that?"
  reference: |
    SELECT title FROM Movie m
    WHERE NOT EXISTS (SELECT * FROM Movie m2 WHERE m2.director = m.director AND m2.year < 1980);
  candidates:
    - query: SELECT title FROM Movie m WHERE NOT EXISTS (SELECT * FROM Movie m2 WHERE m2.director = m.director AND m2.year < 1980);
    - query: SELECT title FROM Movie WHERE director NOT IN (SELECT director FROM Movie WHERE year < 1980);
      why: "Snow White's null director is in the subquery's result, so NOT IN is never true and nothing comes back."
    - query: SELECT title FROM Movie WHERE director NOT IN (SELECT director FROM Movie WHERE year < 1980 AND director IS NOT NULL);
      why: "Close, but a movie with a null director gives NULL NOT IN (…), which is unknown, so it's left out."
    - query: SELECT title FROM Movie EXCEPT SELECT title FROM Movie WHERE director IN (SELECT director FROM Movie WHERE year < 1980);
    - query: SELECT title FROM Movie WHERE director <> ALL (SELECT director FROM Movie WHERE year < 1980);
      why: "<> ALL is the same as NOT IN and has the same problem with the null."

