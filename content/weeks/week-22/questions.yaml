# ---------------------------------------------------------------- DDL: keys, constraints, functions, triggers

- id: le2-q-movie-pk
  type: sql
  topics: [lab.le2, ddl.alter, ddl.constraints]
  difficulty: 1
  dataset: lab-le2
  show: { tables: [Movie] }
  prompt: "Make mID the primary key of Movie (the table already exists)."
  reference: ALTER TABLE Movie ADD PRIMARY KEY (mID);
  check: "SELECT kcu.column_name FROM information_schema.table_constraints tc JOIN information_schema.key_column_usage kcu ON tc.constraint_name = kcu.constraint_name AND tc.table_schema = kcu.table_schema WHERE tc.table_name = 'movie' AND tc.constraint_type = 'PRIMARY KEY' AND tc.table_schema = current_schema();"

- id: le2-q-stars-check
  type: sql
  topics: [lab.le2, ddl.alter, ddl.constraints]
  difficulty: 2
  dataset: lab-le2
  show: { tables: [Rating] }
  prompt: "Add a constraint named stars_range to Rating so that stars must be from 1 to 5."
  reference: ALTER TABLE Rating ADD CONSTRAINT stars_range CHECK (stars BETWEEN 1 AND 5);
  check: "SELECT conname FROM pg_constraint WHERE conrelid = 'rating'::regclass AND contype = 'c';"

- id: le2-q-runs
  type: sql_runs
  topics: [lab.le2, ddl.alter, ddl.constraints]
  difficulty: 3
  dataset: lab-le2
  show: { diagram: true }
  prompt: "The tables were created with no keys at all. Starting from the original script each time, which of these statements run without an error?"
  candidates:
    - sql: ALTER TABLE Movie ADD PRIMARY KEY (mID);
    - sql: ALTER TABLE Reviewer ADD PRIMARY KEY (rID);
    - sql: ALTER TABLE Rating ADD PRIMARY KEY (rID, mID);
      why: "Sarah Martinez rated Gone with the Wind twice, so (201, 101) appears twice."
    - sql: ALTER TABLE Rating ADD PRIMARY KEY (rID, mID, ratingDate);
      why: "Two ratings have no date, and a primary key column can't be null."
    - sql: ALTER TABLE Rating ADD FOREIGN KEY (mID) REFERENCES Movie (mID);
      why: "A foreign key must refer to a primary key or UNIQUE column, and Movie.mID is neither yet."
    - sql: INSERT INTO Rating VALUES (999, 999, 9, NULL);

- id: le2-q-avg-function
  type: sql
  topics: [lab.le2, ddl.functions]
  difficulty: 3
  dataset: lab-le2
  show: { tables: [Rating] }
  prompt: "Write a PL/pgSQL function avg_stars(m INTEGER) that returns movie m's average rating rounded to 2 decimals (null if it has no ratings)."
  reference: |
    CREATE OR REPLACE FUNCTION avg_stars(m INTEGER)
    RETURNS NUMERIC
    LANGUAGE plpgsql
    AS $$
    DECLARE
      a NUMERIC;
    BEGIN
      SELECT ROUND(AVG(stars), 2) INTO a FROM Rating WHERE mID = m;
      RETURN a;
    END;
    $$;
  check: SELECT mID, avg_stars(mID) FROM Movie ORDER BY mID;

- id: le2-q-cascade-trigger
  type: sql
  topics: [lab.le2, ddl.triggers]
  difficulty: 3
  dataset: lab-le2
  show: { tables: [Movie, Rating] }
  prompt: "There's no foreign key, so deleting a movie leaves its ratings behind. Write a trigger function and a FOR EACH ROW trigger on Movie that deletes a movie's ratings whenever the movie is deleted. (The check then deletes Avatar.)"
  reference: |
    CREATE OR REPLACE FUNCTION delete_movie_ratings()
    RETURNS TRIGGER
    LANGUAGE plpgsql
    AS $$
    BEGIN
      DELETE FROM Rating WHERE mID = OLD.mID;
      RETURN OLD;
    END;
    $$;
    CREATE TRIGGER movie_deleted AFTER DELETE ON Movie FOR EACH ROW EXECUTE FUNCTION delete_movie_ratings();
  check: "DELETE FROM Movie WHERE title = 'Avatar'; SELECT * FROM Rating ORDER BY rID, mID, stars;"
  hints: ["The deleted movie is OLD; its id is OLD.mID.", "BEFORE DELETE works too, as long as the function returns OLD."]

# ---------------------------------------------------------------- more queries in the exam's style

- id: le2-q-cameron-reviewers
  type: sql
  topics: [lab.le2, sql.joins]
  tags: [lab-query]
  difficulty: 1
  dataset: lab-le2
  compare: bag
  show: { diagram: true }
  prompt: "List the names of reviewers who rated at least one James Cameron movie, each once."
  reference: |
    SELECT DISTINCT name FROM Reviewer
    JOIN Rating ON Reviewer.rID = Rating.rID
    JOIN Movie ON Rating.mID = Movie.mID
    WHERE director = 'James Cameron';

- id: le2-q-director-best
  type: sql
  topics: [lab.le2, sql.correlated, sql.joins]
  tags: [lab-query]
  difficulty: 3
  dataset: lab-le2
  show: { tables: [Movie, Rating] }
  prompt: "For each director, give the director, the title of their movie(s) with the highest rating any of their movies received, and that rating. Ignore movies with no director."
  reference: |
    SELECT m.director, m.title, r.stars
    FROM Movie m JOIN Rating r ON m.mID = r.mID
    WHERE m.director IS NOT NULL
      AND r.stars = (SELECT MAX(r2.stars) FROM Movie m2 JOIN Rating r2 ON m2.mID = r2.mID WHERE m2.director = m.director)
    GROUP BY m.director, m.title, r.stars;
  explanation: "The correlated subquery finds the director's top rating; GROUP BY (or DISTINCT) removes repeats when that top rating was given more than once."

- id: le2-q-all-spielberg
  type: sql
  topics: [lab.le2, sql.division, sql.correlated]
  tags: [lab-query]
  difficulty: 3
  dataset: lab-le2
  show: { diagram: true }
  prompt: "List the names of reviewers who rated every movie directed by Steven Spielberg."
  reference: |
    SELECT name FROM Reviewer v
    WHERE NOT EXISTS (
      SELECT mID FROM Movie WHERE director = 'Steven Spielberg'
      EXCEPT
      SELECT mID FROM Rating r WHERE r.rID = v.rID);

- id: le2-q-above-overall
  type: sql
  topics: [lab.le2, sql.having, sql.subqueries]
  tags: [lab-query]
  difficulty: 2
  dataset: lab-le2
  show: { tables: [Movie, Rating] }
  prompt: "List the titles of movies whose average rating is higher than the average of all ratings."
  reference: |
    SELECT title FROM Movie JOIN Rating ON Movie.mID = Rating.mID
    GROUP BY Movie.mID, title
    HAVING AVG(stars) > (SELECT AVG(stars) FROM Rating);

- id: le2-q-few-ratings
  type: sql
  topics: [lab.le2, sql.joins, sql.having]
  tags: [lab-query]
  difficulty: 2
  dataset: lab-le2
  show: { tables: [Movie, Rating] }
  prompt: "List the title and number of ratings of every movie with fewer than 2 ratings, including movies with none."
  reference: SELECT title, COUNT(Rating.mID) FROM Movie LEFT JOIN Rating ON Movie.mID = Rating.mID GROUP BY Movie.mID, title HAVING COUNT(Rating.mID) < 2;

- id: le2-q-latest-rating
  type: sql
  topics: [lab.le2, sql.group-by, sql.joins]
  tags: [lab-query]
  difficulty: 2
  dataset: lab-le2
  compare: ordered
  show: { tables: [Reviewer, Rating] }
  prompt: "For each reviewer with at least one dated rating, give the name and the date of their most recent rating, newest first, then by name."
  reference: |
    SELECT name, MAX(ratingDate) AS latest
    FROM Reviewer JOIN Rating ON Reviewer.rID = Rating.rID
