# Lab exam practice, schema 2. Every answer is run against the original rows and a hidden second set.

# ---------------------------------------------------------------- single table

- id: le2-q-spielberg
  type: sql
  topics: [lab.le2, sql.select-from-where]
  tags: [lab-query]
  difficulty: 1
  dataset: lab-le2
  show: { tables: [Movie] }
  prompt: "List the titles of all movies directed by Steven Spielberg."
  reference: SELECT title FROM Movie WHERE director = 'Steven Spielberg';

- id: le2-q-good-years
  type: sql
  topics: [lab.le2, sql.joins, sql.distinct-order]
  tags: [lab-query]
  difficulty: 2
  dataset: lab-le2
  compare: ordered
  show: { tables: [Movie, Rating] }
  prompt: "List every year (once each, ascending) that has a movie which received a rating of 4 or 5."
  reference: SELECT DISTINCT year FROM Movie JOIN Rating ON Movie.mID = Rating.mID WHERE stars >= 4 ORDER BY year;

- id: le2-q-null-dates
  type: sql
  topics: [lab.le2, sql.where, sql.joins]
  tags: [lab-query]
  difficulty: 1
  dataset: lab-le2
  show: { tables: [Reviewer, Rating] }
  prompt: "List the names of reviewers who have a rating with no date."
  reference: SELECT DISTINCT name FROM Reviewer JOIN Rating ON Reviewer.rID = Rating.rID WHERE ratingDate IS NULL;
  explanation: "= NULL is never true. Use IS NULL."

- id: le2-q-full-list
  type: sql
  topics: [lab.le2, sql.joins, sql.distinct-order]
  tags: [lab-query]
  difficulty: 2
  dataset: lab-le2
  compare: ordered
  show: { diagram: true }
  prompt: "List every rating as (reviewer name, movie title, stars, ratingDate), sorted by reviewer name, then title, then stars."
  reference: |
    SELECT name, title, stars, ratingDate
    FROM Rating JOIN Reviewer ON Rating.rID = Reviewer.rID JOIN Movie ON Rating.mID = Movie.mID
    ORDER BY name, title, stars;

# ---------------------------------------------------------------- self-joins

- id: le2-q-rerated-higher
  type: sql
  topics: [lab.le2, sql.joins]
  tags: [lab-query]
  difficulty: 3
  dataset: lab-le2
  show: { diagram: true }
  prompt: "For every case where the same reviewer rated the same movie twice and gave it a higher rating the second time (by date), give the reviewer's name and the movie's title."
  reference: |
    SELECT name, title
    FROM Rating r1 JOIN Rating r2 ON r1.rID = r2.rID AND r1.mID = r2.mID
    JOIN Reviewer ON r1.rID = Reviewer.rID
    JOIN Movie ON r1.mID = Movie.mID
    WHERE r1.ratingDate < r2.ratingDate AND r1.stars < r2.stars;
  explanation: "Pair Rating with itself on (rID, mID): r1 is the earlier rating and r2 the later one. In the hidden rows somebody re-rates a movie lower, which must not be listed."

- id: le2-q-reviewer-pairs
  type: sql
  topics: [lab.le2, sql.joins]
  tags: [lab-query]
  difficulty: 3
  dataset: lab-le2
  show: { diagram: true }
  prompt: "List every pair of reviewers who rated the same movie, as (name1, name2) with name1 alphabetically before name2, each pair once."
  reference: |
    SELECT DISTINCT a.name, b.name
    FROM Rating r1 JOIN Rating r2 ON r1.mID = r2.mID
    JOIN Reviewer a ON r1.rID = a.rID
    JOIN Reviewer b ON r2.rID = b.rID
    WHERE a.name < b.name;

# ---------------------------------------------------------------- aggregates

- id: le2-q-max-stars
  type: sql
  topics: [lab.le2, sql.group-by]
  tags: [lab-query]
  difficulty: 2
  dataset: lab-le2
  compare: ordered
  show: { tables: [Movie, Rating] }
  prompt: "For each movie that has at least one rating, give its title and highest number of stars, sorted by title."
  reference: SELECT title, MAX(stars) FROM Movie JOIN Rating ON Movie.mID = Rating.mID GROUP BY Movie.mID, title ORDER BY title;

- id: le2-q-spread
  type: sql
  topics: [lab.le2, sql.group-by]
  tags: [lab-query]
  difficulty: 2
  dataset: lab-le2
  compare: ordered
  show: { tables: [Movie, Rating] }
  prompt: "For each rated movie, give its title and its rating spread (highest stars minus lowest). Sort by spread from largest to smallest, then by title."
  reference: |
    SELECT title, MAX(stars) - MIN(stars) AS spread
    FROM Movie JOIN Rating ON Movie.mID = Rating.mID
    GROUP BY Movie.mID, title
    ORDER BY spread DESC, title;

- id: le2-q-well-rated
  type: sql
  topics: [lab.le2, sql.having]
  tags: [lab-query]
  difficulty: 2
  dataset: lab-le2
  show: { tables: [Movie, Rating] }
  prompt: "List the title and average stars (rounded to 2 decimals) of every movie whose average rating is at least 3.5."
  reference: |
    SELECT title, ROUND(AVG(stars), 2)
    FROM Movie JOIN Rating ON Movie.mID = Rating.mID
    GROUP BY Movie.mID, title
    HAVING AVG(stars) >= 3.5;
  explanation: "Filter on AVG(stars) itself, not on the rounded value, so 3.495 isn't let through."

- id: le2-q-best-average
  type: sql
  topics: [lab.le2, sql.having, sql.subqueries]
  tags: [lab-query]
  difficulty: 3
  dataset: lab-le2
  show: { tables: [Movie, Rating] }
  prompt: "List the title(s) of the movie(s) with the highest average rating (all of them, if there's a tie)."
  reference: |
    SELECT title FROM Movie JOIN Rating ON Movie.mID = Rating.mID
    GROUP BY Movie.mID, title
    HAVING AVG(stars) >= ALL (SELECT AVG(stars) FROM Rating GROUP BY mID);

- id: le2-q-before-after
  type: sql
  topics: [lab.le2, sql.aggregates, sql.subqueries]
  tags: [lab-query]
  difficulty: 3
  dataset: lab-le2
  show: { tables: [Movie, Rating] }
  prompt: "Work out each movie's average rating. Then find the average of those averages for movies released before 1980, and for movies released in 1980 or later. Give the first minus the second, rounded to 2 decimals (one number)."
  reference: |
    SELECT ROUND(
      (SELECT AVG(a) FROM (SELECT AVG(stars) AS a FROM Rating JOIN Movie USING (mID) WHERE year < 1980 GROUP BY mID) pre)
      - (SELECT AVG(a) FROM (SELECT AVG(stars) AS a FROM Rating JOIN Movie USING (mID) WHERE year >= 1980 GROUP BY mID) post),
      2);
  explanation: "Average the per-movie averages, not the raw ratings: a movie with more ratings mustn't count for more."

- id: le2-q-directors
  type: sql
  topics: [lab.le2, sql.having]
  tags: [lab-query]
  difficulty: 2
  dataset: lab-le2
  show: { tables: [Movie] }
  prompt: "List each director who directed more than one movie, with the number of movies. Leave out movies with no director."
  reference: SELECT director, COUNT(*) FROM Movie WHERE director IS NOT NULL GROUP BY director HAVING COUNT(*) > 1;
  explanation: "GROUP BY puts all the nulls in one group. In the hidden rows there are two movies with no director, so without the IS NOT NULL a null 'director' shows up."

- id: le2-q-count-including-zero
  type: sql
  topics: [lab.le2, sql.joins, sql.group-by]
  tags: [lab-query]
  difficulty: 2
  dataset: lab-le2
  show: { tables: [Reviewer, Rating] }
  prompt: "For every reviewer, give the name and the number of ratings they've made. Reviewers with no ratings appear with 0."
  reference: SELECT name, COUNT(Rating.mID) FROM Reviewer LEFT JOIN Rating ON Reviewer.rID = Rating.rID GROUP BY Reviewer.rID, name;
  explanation: "LEFT JOIN keeps reviewers with no ratings; COUNT(Rating.mID) counts 0 for them, while COUNT(*) would count the null-padded row as 1."

