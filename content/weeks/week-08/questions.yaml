# ---------------------------------------------------------------- Section II style: 2-point matching

- id: w8-q-match-mvd
  type: matching
  topics: [nf.mvd, nf.4nf]
  difficulty: 2
  points: 2
  tags: [nf-match, quiz-style, trap]
  prompt: "Match each relation to its description."
  left:
    - "PERSON(SIN, PhoneNos, KidsSIN)"
    - "STUINFO(StudentNo, Height, ShoeSize)"
    - "OFFERING(Course, Teacher, Textbook), where each teacher of a course picks their own textbook"
  right:
    - "Has a non-trivial MVD, so it isn't in 4NF"
    - "Its MVDs are all FDs, so it is in 4NF"
    - "No MVD: the multi-valued facts aren't independent"
  answer: [0, 1, 2]
  explanation: "Phones and kids are independent sets for one SIN. Height and shoe size are single values (FDs). A textbook depends on the teacher, so not every pairing appears."

- id: w8-q-match-forms
  type: matching
  topics: [nf.recap, nf.4nf, nf.bcnf]
  difficulty: 2
  points: 2
  tags: [nf-match, quiz-style]
  prompt: "Match each problem to the first normal form it breaks."
  left:
    - "A non-key attribute depends on another non-key attribute."
    - "A determinant isn't a candidate key, though it determines only part of a key."
    - "Two independent sets of values for the same student share one relation."
    - "A non-key attribute depends on part of the key."
  right: ["2NF", "3NF", "BCNF", "4NF"]
  answer: [1, 2, 3, 0]
  explanation: "Transitive (3NF), a non-key determinant (BCNF), an MVD (4NF), partial (2NF)."

- id: w8-q-match-tradeoff
  type: matching
  topics: [nf.denormalization]
  difficulty: 2
  points: 2
  tags: [nf-match, quiz-style]
  prompt: "Match each statement to the design it describes."
  left:
    - "Each fact is stored once, so changing it is quick and can't leave copies disagreeing."
    - "Reads are faster because related facts sit in the same row, but some facts are stored many times."
    - "Getting a full address takes a join of two relations."
  right: ["Normalized", "Denormalized"]
  answer: [0, 1, 0]
  explanation: "Normalization optimizes updates at the expense of retrievals; denormalization trades the other way."

- id: w8-q-match-sch-anomalies
  type: matching
  topics: [nf.mvd, nf.recap]
  difficulty: 2
  points: 2
  tags: [nf-match, quiz-style]
  prompt: "SCH(Student, Courses, Hobbies) stores every combination of a student's courses and hobbies. Match each problem to its anomaly."
  left:
    - "Habib takes up chess, which takes three new rows, one per course."
    - "A new student with hobbies but no courses yet can't be stored."
    - "Jin drops both courses, and the fact that Jin cooks disappears."
  right: [Insertion anomaly, Modification anomaly, Deletion anomaly]
  answer: [1, 0, 2]
  explanation: "One fact (Habib has a hobby) must be written in several rows: modification. Courses is part of the key, so a student with no courses can't be inserted. Deleting the courses deletes the hobbies with them."

# ---------------------------------------------------------------- concepts

- id: w8-q-bcnf-enough
  type: true_false
  topics: [nf.bcnf, nf.mvd]
  difficulty: 2
  tags: [quiz-style, trap]
  prompt: "A relation in BCNF has no redundancy at all."
  answer: false
  explanation: "BCNF removes redundancy caused by FDs. An all-key relation like SCH is in BCNF and still repeats each course once per hobby, because of an MVD."

- id: w8-q-fd-is-mvd
  type: true_false
  topics: [nf.mvd]
  difficulty: 2
  tags: [quiz-style]
  prompt: "Every functional dependency is also a multivalued dependency."
  answer: true
  explanation: "If A → B, each A value has a set of exactly one B value, which satisfies A →→ B."

- id: w8-q-why-mvd
  type: mcq
  topics: [nf.mvd]
  difficulty: 2
  tags: [quiz-style]
  prompt: Why do multivalued dependencies arise in the first place?
  options:
    - "1NF doesn't allow an attribute to hold a set of values, so independent sets become combinations of rows."
    - "The relation has a partial dependency on its key."
    - "The relation was mapped from an ER model."
    - "The relation has two overlapping candidate keys."
  answer: 0
  explanation: "That's the lecture's explanation. Mapping from ER is actually what usually avoids them (each multivalued attribute gets its own relation)."

- id: w8-q-er-4nf
  type: mcq
  topics: [nf.4nf]
  difficulty: 2
  tags: [quiz-style]
  prompt: "Why do relations mapped from an ER model usually need no transformation to 4NF?"
  options:
    - "Each multivalued attribute gets its own relation (mapping step 6), so two independent sets never share one."
    - "Mapping removes every functional dependency."
    - "ER diagrams can't show multivalued attributes."
    - "Every mapped relation has a single-attribute key."
  answer: 0
  explanation: "DEP_LOCATION and MEMBER_PHONE are examples: one owner key plus one set of values each."

- id: w8-q-mvd-rows
  type: mcq
  topics: [nf.mvd]
  difficulty: 2
  tags: [quiz-style]
  prompt: "In SCH, a student takes 4 courses and has 3 hobbies. With Student →→ Courses | Hobbies, how many rows does that student have?"
  options: ["7", "12", "4", "3"]
  answer: 1
  explanation: "Every course is paired with every hobby: 4 × 3 = 12. In SC and SH it would be 4 + 3 = 7."

- id: w8-q-denorm-not
  type: mcq
  topics: [nf.denormalization]
  difficulty: 2
  tags: [quiz-style, negated-stem]
  prompt: Which statement about denormalization is **not** true?
  options:
    - It adds redundant data or groups data to make retrieval faster.
    - It moves a design from a higher normal form to a lower one.
    - It removes the risk of update anomalies.
    - It can make sense when joins of separately stored relations are slow.
  answer: 2
  explanation: "It does the opposite: redundancy brings back the possibility of update anomalies. That's the price paid for faster reads."

- id: w8-q-denorm-when
  type: mcq
  topics: [nf.denormalization]
  difficulty: 2
  tags: [quiz-style, all-none-option]
  prompt: "When is keeping CONTACT(Name, Street, Zip, City, Province) denormalized (in 2NF) a reasonable choice?"
  options:
    - When addresses are almost always read whole, so splitting off ZIP would add a join to every lookup
    - When a postal code's city and province essentially never change, so the anomaly rarely happens
    - When the redundancy is small compared with the cost of the join
    - All of the given choices
    - None of the given choices
  answer: 3
  explanation: "All three are the usual arguments for denormalizing: read-heavy access, rarely-changing data and small redundancy."

- id: w8-q-bcnf-when
  type: mcq
  topics: [nf.bcnf, nf.recap]
  difficulty: 2
  tags: [quiz-style]
  prompt: "Update anomalies can remain in a 3NF relation when its candidate keys are…"
  options:
    - "multiple, composite and overlapping"
    - "a single attribute"
    - "multiple but disjoint single attributes"
    - "the whole heading"
  answer: 0
  explanation: "That's the TEACH situation: (Student, Course) and (Student, Instructor) overlap on Student."

