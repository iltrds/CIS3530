- id: w8-q-sql-sch
  type: sql
  topics: [nf.4nf, nf.mvd]
  difficulty: 1
  dataset: nf-mvd
  show: { tables: [SC, SH] }
  prompt: "SCH was decomposed into SC(student, course) and SH(student, hobby). Write a query that rebuilds SCH, with columns student, course, hobby."
  reference: SELECT student, course, hobby FROM SC NATURAL JOIN SH;
  explanation: "Joining on student pairs each course with each hobby of the same student, exactly the combinations the MVD says SCH holds."

- id: w8-q-sql-contact
