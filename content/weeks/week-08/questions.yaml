# ---------------------------------------------------------------- Section II style: name it

- id: w8-q-kind-mvd
  type: short
  style: conceptual
  topics: [nf.mvd]
  difficulty: 1
  tags: [nf-kind, quiz-style]
  prompt: "In SCH(Student, Courses, Hobbies), each student has a set of courses and a set of hobbies, and the two sets have nothing to do with each other. What kind of dependency is this?"
  answers: [multivalued, multivalued dependency, multi-valued dependency, multi-valued, mvd, an mvd, a multivalued dependency]
  explanation: "Student →→ Courses | Hobbies: a multivalued dependency, from two independent 1:N relationships in one relation."

- id: w8-q-kind-4nf
  type: short
  style: conceptual
  topics: [nf.4nf]
  difficulty: 2
  tags: [nf-kind, quiz-style, trap]
  prompt: "SCH(Student, Courses, Hobbies) has no non-trivial functional dependencies, but has Student →→ Courses | Hobbies. Which normal form is the first one it fails?"
  answers: [4NF, fourth normal form, 4 NF, 4th normal form, fourth]
  explanation: "No non-trivial FDs, so it's in BCNF; the MVD isn't an FD, so it fails 4NF."

- id: w8-q-kind-denorm
  type: short
  style: conceptual
  topics: [nf.denormalization]
  difficulty: 1
  tags: [nf-kind, quiz-style]
  prompt: "Reports join ORDER and CUSTOMER millions of times a day, so a designer copies the customer's name into ORDER, accepting the redundancy to avoid the join. What is this process called?"
  answers: [denormalization, denormalisation, denormalizing, denormalising]
  explanation: "Deliberately adding redundant data to speed up retrieval: denormalization."

- id: w8-q-kind-stuinfo
  type: short
  style: conceptual
  topics: [nf.4nf, nf.mvd]
  difficulty: 2
  tags: [nf-kind, quiz-style, trap]
  prompt: "STUINFO(<u>StudentNo</u>, Height, ShoeSize): each student has one height and one shoe size. What is its highest normal form, among 1NF, 2NF, 3NF, BCNF and 4NF?"
  answers: [4NF, fourth normal form, 4 NF, 4th normal form]
  explanation: "Its only MVDs are the FDs StudentNo → Height and StudentNo → ShoeSize, on the key, so it's in 4NF."

- id: w8-q-kind-contact
  type: short
  style: conceptual
  topics: [nf.denormalization, nf.3nf]
  difficulty: 2
  tags: [nf-kind, quiz-style]
  prompt: "CONTACT(<u>Name</u>, Street, Zip, City, Province) has Zip → City, Province. What kind of dependency do City and Province have on Name?"
  answers: [transitive, transitive dependency, transitive functional dependency]
  explanation: "Name → Zip and Zip → City, Province: transitive, which is why CONTACT is in 2NF but not 3NF."

- id: w8-q-kind-teach
  type: short
  style: conceptual
  topics: [nf.bcnf, nf.recap]
  difficulty: 2
  tags: [nf-kind, quiz-style]
  prompt: "TEACH(<u>Student, Course</u>, Instructor) has Instructor → Course, and Instructor isn't a candidate key. Which normal form does TEACH fail?"
  answers: [BCNF, Boyce-Codd normal form, Boyce Codd normal form, boyce-codd, boyce–codd normal form]
  explanation: "It's in 3NF (Course is part of the key), but Instructor is a determinant that isn't a candidate key, so not BCNF."

# ---------------------------------------------------------------- Section II style: complete the term (recall)

- id: w8-q-term-4nf
  type: short
  topics: [nf.4nf]
  difficulty: 1
  tags: [term]
  prompt: "A relation is in 4NF if it is in BCNF and it has no ______ dependencies, or all of them are also FDs."
  answers: [multivalued, multi-valued, multivalued dependencies, mvd, mvds]
  explanation: "4NF: BCNF, and no MVDs other than ones that are also FDs."

- id: w8-q-term-updates
  type: short
  topics: [nf.denormalization]
  difficulty: 1
  tags: [term]
  prompt: "Normalization puts one fact in one place. This optimizes ______ at the expense of retrievals."
  answers: [updates, updating, update, modifications]
  explanation: "Changing a fact means changing it in one place; reading related facts means joining several relations."

- id: w8-q-term-lower
  type: short
  topics: [nf.denormalization]
  difficulty: 1
  tags: [term]
  prompt: "Denormalization moves a design from a higher normal form to a ______ one, to speed up database access."
  answers: [lower]
  explanation: "From the lecture's definition: a technique to move from higher to lower normal forms."

- id: w8-q-term-mvd-notation
  type: short
  topics: [nf.mvd]
  difficulty: 1
  tags: [term]
  prompt: "The MVD in SCH is written Student ______ Courses | Hobbies. Which symbol goes in the blank?"
  answers: ["→→", "->>", "↠", "-->>", "->->"]
  explanation: "A double arrow: Student →→ Courses | Hobbies."

- id: w8-q-term-independent
  type: short
  topics: [nf.mvd]
  difficulty: 1
  tags: [term]
  prompt: "An MVD exists in a relation R when there are two ______ 1:N relationships in R."
  answers: [independent]
