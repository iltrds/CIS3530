# ---------------------------------------------------------------------------
# SQL-format quiz questions: degree/cardinality of a query, and which queries
# are valid or equivalent. Answers are computed by running the queries.

- id: w3-q-shape-paris-shipments
  type: query_shape
  topics: [sql.subqueries, sql.select-from-where]
  difficulty: 1
  dataset: supplier-parts
