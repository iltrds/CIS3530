- id: w3-q-choices-in-to-natural
  type: query_choices
  topics: [sql.subqueries, sql.joins, sql.distinct-order]
  difficulty: 2
  dataset: supplier-parts
  prompt: |
    This query lists every part supplied by S2 or S3:
    ```sql
    SELECT *
    FROM P
    WHERE pno IN (SELECT pno
                  FROM SP
                  WHERE sno IN ('S2', 'S3'));
    ```
    Which query returns the same result using a natural join?
  reference: SELECT * FROM P WHERE pno IN (SELECT pno FROM SP WHERE sno IN ('S2', 'S3'));
  candidates:
    - query: |
        SELECT DISTINCT P.pno, pname, color, weight, city
        FROM P NATURAL JOIN SP
        WHERE sno IN ('S2', 'S3');
    - query: |
        SELECT pno, pname, color, weight, city
        FROM P NATURAL JOIN SP
        WHERE sno IN ('S2', 'S3');
      why: P3 is supplied by both S2 and S3, so the join produces it twice.
    - query: |
        SELECT *
        FROM P NATURAL JOIN SP
        WHERE sno IN ('S2', 'S3');
      why: SELECT * after a join also returns SP's columns.
    - query: |
        SELECT pno, pname, DISTINCT color, weight, city
        FROM P NATURAL JOIN SP
        WHERE sno IN ('S2', 'S3');
      why: DISTINCT has to come straight after SELECT; it applies to the whole row.

- id: w3-q-choices-in-to-product
  type: query_choices
  topics: [sql.subqueries, sql.joins, sql.distinct-order]
  difficulty: 2
  tags: [trap]
  dataset: supplier-parts
  prompt: |
    ```sql
    SELECT *
    FROM S
    WHERE sno IN (SELECT sno
                  FROM SP
                  WHERE pno IN ('P3', 'P5'));
    ```
    Which query returns the same result using a Cartesian product (`FROM S, SP`)?
  reference: SELECT * FROM S WHERE sno IN (SELECT sno FROM SP WHERE pno IN ('P3', 'P5'));
  candidates:
    - query: |
        SELECT DISTINCT S.sno, sname, status, city
        FROM S, SP
        WHERE S.sno = SP.sno
          AND pno IN ('P3', 'P5');
    - query: |
        SELECT S.sno, sname, status, city
        FROM S, SP
        WHERE S.sno = SP.sno
          AND pno IN ('P3', 'P5');
      why: S2 supplies both P3 and P5, so it appears once per shipment.
    - query: |
        SELECT DISTINCT S.sno, sname, status, city
        FROM S, SP
        WHERE pno IN ('P3', 'P5');
      why: Without S.sno = SP.sno, every supplier is paired with every matching shipment.
    - query: |
        SELECT DISTINCT sno, sname, status, city
        FROM S, SP
        WHERE S.sno = SP.sno
          AND pno IN ('P3', 'P5');
      why: Both S and SP have an sno column, so an unqualified sno is ambiguous in a Cartesian product.
    - query: |
        SELECT S.sno, sname, status, city DISTINCT
        FROM S, SP
        WHERE S.sno = SP.sno
          AND pno IN ('P3', 'P5');
      why: "Postgres doesn't reject this: it reads DISTINCT as a new name for the city column, so nothing is de-duplicated."

- id: w3-q-choices-blue-none
  type: query_choices
  topics: [sql.joins, sql.subqueries]
  difficulty: 3
  tags: [trap]
  dataset: supplier-parts
  prompt: Which query lists the names of suppliers who supply at least one BLUE part, each name once?
  reference: SELECT sname FROM S WHERE sno IN (SELECT sno FROM SP WHERE pno IN (SELECT pno FROM P WHERE color = 'BLUE'));
  candidates:
    - query: |
        SELECT sname
        FROM S NATURAL JOIN SP NATURAL JOIN P
        WHERE color = 'BLUE';
      why: S and P both have a city column, so this natural join also requires the supplier and the part to be in the same city.
    - query: |
        SELECT sname
        FROM S, SP, P
        WHERE S.sno = SP.sno
          AND SP.pno = P.pno
          AND color = 'BLUE';
      why: Suppliers of two blue parts appear twice.
    - query: |
        SELECT DISTINCT sname
        FROM S, SP, P
        WHERE S.sno = SP.sno
          AND color = 'BLUE';
      why: SP isn't linked to P, so every supplier with any shipment qualifies.
    - query: |
        SELECT sname
        FROM S
        WHERE sno = (SELECT sno
                     FROM SP
                     WHERE pno IN (SELECT pno FROM P WHERE color = 'BLUE'));
      why: "= needs the subquery to return one value; use IN."

- id: w3-q-choices-scan-p5
  type: query_choices
  topics: [sql.joins]
  difficulty: 2
  dataset: supplier-parts
  prompt: |
    Which query returns the same result as this one?
    ```sql
    SELECT pname, qty
    FROM P NATURAL JOIN SP
    WHERE sno = 'S5';
    ```
  reference: SELECT pname, qty FROM P NATURAL JOIN SP WHERE sno = 'S5';
  candidates:
    - query: |
        SELECT pname, qty
        FROM P, SP
        WHERE P.pno = SP.pno
          AND sno = 'S5';
    - query: |
        SELECT pname, qty
        FROM P, SP
        WHERE sno = 'S5';
      why: Without P.pno = SP.pno, each of S5's shipments is paired with every part.
    - query: |
        SELECT pname, qty
        FROM P, SP
        WHERE pno = pno
          AND sno = 'S5';
      why: In a Cartesian product, pno exists in both tables and must be qualified.
    - query: |
        SELECT *
        FROM P, SP
        WHERE P.pno = SP.pno
          AND sno = 'S5';
      why: SELECT * returns every column of both tables.
    - query: |
        SELECT pname, qty
        FROM P, SP
        WHERE P.pno = SP.pno
           OR sno = 'S5';
      why: OR keeps every matching pair plus every pairing with an S5 shipment.

- id: w3-q-choices-supply-p4
  type: query_choices
  topics: [sql.joins, sql.subqueries]
  difficulty: 2
  dataset: supplier-parts
  multi: true
  noneOption: true
  prompt: Which of the following are valid queries to get the names of suppliers who supply part P4? **Select all choices that apply.**
  reference: SELECT sname FROM S WHERE sno IN (SELECT sno FROM SP WHERE pno = 'P4');
  candidates:
    - query: |
        SELECT sname
        FROM S JOIN SP ON S.sno = SP.sno
        WHERE pno = 'P4';
    - query: |
        SELECT sname
        FROM S, SP
        WHERE pno = 'P4';
      why: No join condition, so every supplier is paired with every P4 shipment.
    - query: |
        SELECT sname
        FROM S NATURAL JOIN SP
        WHERE pno = 'P4'
        ORDER BY sname;
      why: ORDER BY only sorts; it doesn't change which rows come back.
    - query: |
        SELECT DISTINCT sname
        FROM S JOIN SP USING (sno)
        WHERE pno = 'P4';
    - query: |
        SELECT sname
        FROM S, SP
        WHERE S.sno = SP.sno
           OR pno = 'P4';
      why: OR instead of AND keeps every shipment of every supplier.
    - query: |
        SELECT sname
        FROM S
        WHERE sno = (SELECT sno FROM SP WHERE pno = 'P4');
      why: "Two suppliers ship P4, so the subquery returns two rows and = fails. IN would work."

- id: w3-q-choices-no-red
  type: query_choices
  topics: [sql.subqueries, sql.set-ops, sql.joins]
  difficulty: 3
  tags: [trap]
  dataset: supplier-parts
  multi: true
  prompt: Which queries list the names of suppliers who supply **no** red part? **Select all choices that apply.**
  reference: SELECT sname FROM S WHERE sno NOT IN (SELECT sno FROM SP WHERE pno IN (SELECT pno FROM P WHERE color = 'RED'));
  candidates:
    - query: |
        SELECT sname FROM S
        EXCEPT
        SELECT sname
        FROM S, SP, P
        WHERE S.sno = SP.sno
          AND SP.pno = P.pno
          AND color = 'RED';
    - query: |
        SELECT sname
        FROM S
        WHERE sno NOT IN (SELECT sno
                          FROM SP NATURAL JOIN P
                          WHERE color = 'RED');
      why: SP and P share only pno, so this natural join is safe.
    - query: |
        SELECT sname FROM S
        EXCEPT
        SELECT sname
        FROM S NATURAL JOIN SP NATURAL JOIN P
        WHERE color = 'RED';
      why: The three-way natural join also matches S.city = P.city, so it misses red-part suppliers outside London.
    - query: |
        SELECT DISTINCT sname
        FROM S NATURAL JOIN SP
        WHERE pno NOT IN (SELECT pno FROM P WHERE color = 'RED');
      why: This finds suppliers with at least one non-red part, a different question, and a supplier with no shipments drops out in the join.
    - query: |
        SELECT sname
        FROM S
        WHERE sno NOT IN (SELECT sno FROM SP WHERE pno IN ('P1', 'P4', 'P6'));
      why: Listing today's red parts by hand stops being right as soon as another red part is added.

