- id: w3-q-ra-sql-london
  type: ra
  topics: [sql.select-from-where, ra.select]
  difficulty: 1
  dataset: supplier-parts
  show: { diagram: true }
  prompt: "Translate to RA: `SELECT sname FROM S WHERE status > 15 AND city = 'PARIS';`"
  reference: "π sname (σ status > 15 ∧ city = 'PARIS' (S))"

- id: w3-q-select-is-pi
  type: mcq
  topics: [sql.select-from-where]
  difficulty: 1
  tags: [trap, quiz-style]
  prompt: "The SELECT clause of an SQL query corresponds to which relational algebra operator?"
  options: ["σ (select)", "π (project)", "× (product)", "ρ (rename)", "None of the given choices"]
  answer: 1
  explanation: SELECT chooses columns, like π. WHERE plays the part of σ.

- id: w3-q-order-steps
  type: order_steps
  topics: [sql.execution-order]
  difficulty: 1
  prompt: Put the clauses in the order they are evaluated.
  items: [FROM, WHERE, SELECT]
  explanation: "Pick the tables, filter the rows, then choose the columns."

- id: w3-q-eq-subquery
  type: mcq
  topics: [sql.subqueries]
  difficulty: 2
  tags: [quiz-style]
  prompt: |
    Why does this query raise an error on the Week 3 instance?
    ```sql
    SELECT sname FROM S
    WHERE sno = (SELECT sno FROM SP);
    ```
  options:
    - "sno is ambiguous"
    - "The subquery returns more than one row, and = needs a single value"
    - "Subqueries aren't allowed in WHERE"
    - "S and SP aren't union compatible"
    - "None of the given choices"
  answer: 1
  explanation: "Replace = with IN to test membership in the subquery's result."

- id: w3-q-null-compare
  type: mcq
  topics: [sql.where]
  difficulty: 1
  tags: [trap]
  dataset: supplier-parts-w1
  show: { tables: [S] }
  prompt: "On the Week 1 instance, how many rows does `SELECT * FROM S WHERE city = NULL;` return?"
  options: ["0", "1", "6", "An error"]
  answer: 0
  explanation: "A comparison with NULL is never true, so no row qualifies, even HARRY's. Use IS NULL."

- id: w3-q-like-underscore
  type: multi
  topics: [sql.where]
  difficulty: 2
  prompt: "Which names match `sname LIKE '_L%'`? Select all that apply."
  options: [BLAKE, CLARK, SMITH, ALI, LEE]
  answer: [0, 1, 3]
  explanation: "_ is exactly one character, then L, then anything. BLAKE, CLARK and ALI have L second. LEE has L first."

- id: w3-q-between-inclusive
  type: true_false
  topics: [sql.where]
  difficulty: 1
  prompt: "`qty BETWEEN 100 AND 200` includes rows where qty is exactly 100 or exactly 200."
  answer: true
  explanation: BETWEEN is inclusive at both ends.

- id: w3-q-union-dups
  type: true_false
  topics: [sql.set-ops]
  difficulty: 1
  prompt: UNION keeps duplicate rows in its result.
  answer: false
  explanation: UNION, INTERSECT and EXCEPT return sets. (UNION ALL keeps duplicates.)

- id: w3-q-count-star
  type: numeric
  topics: [sql.aggregates]
  difficulty: 1
  dataset: supplier-parts
  show: { tables: [SP] }
  prompt: "What does `SELECT COUNT(DISTINCT pno) FROM SP;` return on the Week 3 instance?"
  answer: 6
  explanation: All six parts, P1 to P6, appear in at least one shipment.

- id: w3-q-count-null
  type: numeric
  topics: [sql.aggregates]
  difficulty: 2
  tags: [trap]
  dataset: supplier-parts-w1
  show: { tables: [S] }
  prompt: "On the Week 1 instance, what does `SELECT COUNT(status) FROM S;` return?"
  answer: 5
  explanation: "COUNT(column) skips nulls. HARRY's status is null, so 5 of the 6 rows count. COUNT(*) would give 6."

- id: w3-q-sum-s5
  type: numeric
  topics: [sql.aggregates]
  difficulty: 1
  dataset: supplier-parts
  show: { tables: [SP] }
  prompt: "What does `SELECT SUM(qty) FROM SP WHERE sno = 'S5';` return?"
  answer: 2000
  explanation: "200 + 500 + 200 + 100 + 200 + 800."

- id: w3-q-count-product
  type: numeric
  topics: [sql.joins, sql.aggregates]
  difficulty: 2
  dataset: supplier-parts
  prompt: "What does `SELECT COUNT(*) FROM S, SP;` return on the Week 3 instance (6 suppliers, 12 shipments)?"
  answer: 72
  explanation: "Without a join condition, FROM S, SP is the Cartesian product: 6 × 12 = 72 rows."

- id: w3-q-natural-three
  type: mcq
  topics: [sql.joins]
  difficulty: 3
  tags: [trap]
  dataset: supplier-parts
  show: { diagram: true }
  prompt: "`SELECT * FROM S NATURAL JOIN SP NATURAL JOIN P;` returns fewer rows than there are shipments. Why?"
  options:
    - NATURAL JOIN only works on two tables
    - S and P both have a city column, so it also requires S.city = P.city
    - SP's primary key is composite
    - NATURAL JOIN removes duplicate rows
  answer: 1
  explanation: "Natural join matches every same-named column. Joining through SP with USING (sno) and USING (pno) avoids matching on city."

- id: w3-q-predict-distinct
  type: predict_table
  topics: [sql.distinct-order, sql.where]
  difficulty: 1
  dataset: supplier-parts
  show: { tables: [S] }
  prompt: Fill in the result of this query.
  sql: SELECT DISTINCT city FROM S WHERE status >= 20;
  explanation: "S1, S3, S4 and S5 have status of at least 20; their cities are LONDON, PARIS, LONDON, ATHENS. DISTINCT keeps each once."

- id: w3-q-predict-in
  type: predict_table
  topics: [sql.where]
  difficulty: 2
  dataset: supplier-parts
  show: { tables: [SP] }
  prompt: Fill in the result of this query.
  sql: SELECT DISTINCT sno FROM SP WHERE qty BETWEEN 200 AND 400 AND pno IN ('P3', 'P6');
  explanation: "Shipments of P3 or P6 with quantity 200 to 400: S2–P3 (400), S3–P3, S4–P6, S5–P6 and S5–P3."

- id: w3-q-match-clauses
  type: matching
  topics: [sql.select-from-where, sql.distinct-order]
  difficulty: 1
  points: 3
  tags: [quiz-style]
  prompt: Match each clause to what it does.
  left: [FROM, WHERE, ORDER BY]
  right: ["Sorts the result", "Names the tables to read", "Keeps only the rows that satisfy a condition"]
  answer: [1, 2, 0]

- id: w3-q-match-where
  type: matching
  topics: [sql.where]
  difficulty: 2
  points: 3
  tags: [quiz-style]
  prompt: Match each condition to its meaning.
  left: ["qty BETWEEN 100 AND 200", "qty IN (100, 200)", "sname LIKE 'S%'"]
  right: ["qty = 100 OR qty = 200", "sname begins with S", "qty >= 100 AND qty <= 200"]
  answer: [2, 0, 1]

- id: w3-q-blanks-sql-1
  type: blanks
  topics: [sql.where, sql.set-ops, sql.basics]
  difficulty: 2
  points: 4
  tags: [quiz-style]
  prompt: "Type **True** or **False** in each box."
  parts:
    - { text: "BETWEEN 100 AND 200 includes both 100 and 200.", answer: "True" }
    - { text: "WHERE city = NULL finds suppliers with no city.", answer: "False" }
    - { text: "UNION keeps duplicate rows.", answer: "False" }
    - { text: "A SELECT without DISTINCT can return duplicate rows.", answer: "True" }

- id: w3-q-blanks-sql-2
  type: blanks
  topics: [sql.aggregates, sql.where, sql.select-from-where]
  difficulty: 2
  points: 4
  tags: [quiz-style, trap]
  prompt: "Type **True** or **False** in each box."
  parts:
    - { text: "COUNT(*) counts rows, including rows that contain nulls.", answer: "True" }
    - { text: "COUNT(DISTINCT sno) and COUNT(sno) always return the same number.", answer: "False" }
    - { text: "In LIKE, _ matches exactly one character.", answer: "True" }
    - { text: "SQL's SELECT clause does the same job as σ in relational algebra.", answer: "False" }
  explanation: "COUNT(sno) counts every non-null sno, repeats included. SELECT corresponds to π; WHERE corresponds to σ."

- id: w3-q-bag-meaning
  type: mcq
  topics: [sql.basics]
  difficulty: 1
  tags: [negated-stem]
  prompt: Which is **not** a way to keep duplicate rows out of SQL results or tables?
  options: [A PRIMARY KEY constraint, A UNIQUE constraint, SELECT DISTINCT, ORDER BY]
  answer: 3
  explanation: ORDER BY only sorts; duplicates stay.

- id: w3-q-dml
  type: mcq
  topics: [sql.basics]
  difficulty: 1
  prompt: SELECT, INSERT, UPDATE and DELETE belong to which part of SQL?
  options: [DDL, DML, DCL, None of the given choices]
  answer: 1
  explanation: They manipulate data. CREATE TABLE is DDL; GRANT is DCL.

- id: w3-q-plans
  type: mcq
  topics: [ra.plans]
  difficulty: 2
  prompt: "Two RA expressions return the same result. One selects the 1970s movies before joining with Roles, the other joins first. What's the practical difference?"
  options:
    - They can return different tuples
    - The select-first plan builds smaller intermediate relations
    - Only the join-first version is valid RA
    - None; RA has no notion of cost
  answer: 1
  explanation: Both are correct; each suggests a different execution plan. Filtering early means fewer tuples to combine.
