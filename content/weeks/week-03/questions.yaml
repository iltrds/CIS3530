  candidates:
    - query: π aName ((π mID, aID (Roles) ÷ π mID (Movies)) ⋈ Artists)
    - query: π aName ((Roles ÷ π mID (Movies)) ⋈ Artists)
      why: Roles still has character, which differs in every tuple, so no (aID, character) pair goes with every movie.
