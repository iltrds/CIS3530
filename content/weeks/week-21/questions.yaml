- id: le1-q-natural-trap
  type: query_choices
  topics: [lab.le1, sql.joins]
  difficulty: 3
  dataset: lab-le1
  show: { diagram: true }
  tags: [trap]
  prompt: "Which query lists the name of each supplier together with the name of each item it supplies (no repeats)?"
  reference: SELECT DISTINCT sname, iname FROM manuSupp s JOIN combine c ON s.manuSupitemNo = c.manuSupitemNo JOIN items i ON c.itemNo = i.itemNo;
  candidates:
    - query: SELECT DISTINCT sname, iname FROM manuSupp NATURAL JOIN combine NATURAL JOIN items;
      why: "manuSupp and items both have CITY, so the natural join also requires the supplier and item to be in the same city."
    - query: SELECT DISTINCT sname, iname FROM (manuSupp NATURAL JOIN combine) JOIN items USING (itemNo);
    - query: SELECT DISTINCT sname, iname FROM manuSupp, combine, items WHERE manuSupp.manuSupitemNo = combine.manuSupitemNo;
      why: "Missing the join condition on itemNo: every supplier is paired with every item."
    - query: SELECT sname, iname FROM manuSupp JOIN combine USING (manuSupitemNo) JOIN items USING (itemNo);
      why: "No DISTINCT: a supplier supplying the same item to several projects repeats."

