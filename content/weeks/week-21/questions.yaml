- id: le1-q-heavy-suppliers
  type: sql
  topics: [lab.le1, sql.joins, sql.group-by]
  tags: [lab-query]
  difficulty: 3
  dataset: lab-le1
  show: { diagram: true }
  prompt: "For each supplier, give its name and the total weight it has shipped (quantity × item weight, summed over its combine rows). Only include suppliers whose total weight is over 20000."
  reference: |
    SELECT s.sname, SUM(c.qty * i.weight)
    FROM manuSupp s
    JOIN combine c ON s.manuSupitemNo = c.manuSupitemNo
    JOIN items i ON c.itemNo = i.itemNo
    GROUP BY s.manuSupitemNo, s.sname
    HAVING SUM(c.qty * i.weight) > 20000;
