# ---------------------------------------------------------------- joins

- id: le1-q-supply-i3
  type: sql
  topics: [lab.le1, sql.joins]
  tags: [lab-query]
  difficulty: 2
  dataset: lab-le1
  compare: bag
  show: { diagram: true }
  prompt: "List the names of suppliers who supply item I3 to at least one project, each name once."
  reference: SELECT DISTINCT sname FROM manuSupp NATURAL JOIN combine WHERE itemNo = 'I3';
  explanation: "M2 supplies I3 to seven projects; without DISTINCT, JONES appears seven times."

- id: le1-q-big-shipments
  type: sql
  topics: [lab.le1, sql.joins]
  tags: [lab-query]
  difficulty: 2
  dataset: lab-le1
  show: { diagram: true }
  prompt: "For every combine row with a quantity of 500 or more, list the supplier name, item name, project name and quantity."
  reference: |
    SELECT s.sname, i.iname, p.proJNAME, c.qty
    FROM combine c
    JOIN manuSupp s ON c.manuSupitemNo = s.manuSupitemNo
    JOIN items i ON c.itemNo = i.itemNo
    JOIN proj p ON c.projNo = p.proJNo
    WHERE c.qty >= 500;
  explanation: "All three tables share CITY with each other, so a NATURAL JOIN of all four would also force the supplier, item and project to be in the same city. Join on the keys explicitly."

