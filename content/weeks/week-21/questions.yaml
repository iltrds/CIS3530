# ---------------------------------------------------------------- every (division)

- id: le1-q-all-items
  type: sql
  topics: [lab.le1, sql.division, sql.correlated]
  tags: [lab-query]
  difficulty: 3
  dataset: lab-le1
  show: { diagram: true }
  prompt: "List the names of suppliers who supply every item (to some project or other)."
  reference: |
    SELECT sname FROM manuSupp s
    WHERE NOT EXISTS (
      SELECT itemNo FROM items
      EXCEPT
      SELECT itemNo FROM combine c WHERE c.manuSupitemNo = s.manuSupitemNo);
  explanation: "Division: no item is missing from the supplier's items. The hidden rows have a seventh item, so a query that hard-codes COUNT = 6 is marked wrong; compare with (SELECT COUNT(*) FROM items) instead."

- id: le1-q-all-red-to-project
  type: sql
  topics: [lab.le1, sql.division, sql.having]
  tags: [lab-query]
  difficulty: 3
  dataset: lab-le1
  show: { diagram: true }
  prompt: "List the numbers of projects that are supplied with every RED item."
  reference: |
    SELECT c.projNo FROM combine c JOIN items i ON c.itemNo = i.itemNo
    WHERE i.color = 'RED'
    GROUP BY c.projNo
    HAVING COUNT(DISTINCT c.itemNo) = (SELECT COUNT(*) FROM items WHERE color = 'RED');

