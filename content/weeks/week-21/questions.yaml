- id: le1-q-runs
  type: sql_runs
  topics: [lab.le1, sql.modify, ddl.constraints]
  difficulty: 2
  dataset: lab-le1
  show: { diagram: true }
  prompt: "Starting from the original rows each time, which of these statements run without an error?"
  candidates:
    - sql: INSERT INTO combine VALUES ('M1', 'I2', 'J3', 150);
    - sql: INSERT INTO combine VALUES ('M1', 'I1', 'J1', 50);
      why: "(M1, I1, J1) is already in combine: duplicate primary key."
    - sql: INSERT INTO combine VALUES ('M9', 'I1', 'J1', 50);
      why: "There's no supplier M9: foreign key violation."
    - sql: INSERT INTO manuSupp VALUES ('M100', 'NEW', 10, 'ROME');
      why: "manuSupitemNo is VARCHAR(3)."
    - sql: DELETE FROM manuSupp WHERE manuSupitemNo = 'M1';
      why: "M1 still has combine rows that refer to it."
    - sql: DELETE FROM combine WHERE manuSupitemNo = 'M1';

# ---------------------------------------------------------------- DDL, functions and triggers

- id: le1-q-ctas-totals
  type: sql
  topics: [lab.le1, ddl.copy, sql.group-by]
  difficulty: 2
  dataset: lab-le1
  show: { tables: [combine] }
  prompt: "Create a table item_totals with columns itemNo and total, holding each item's total quantity supplied, in one statement."
  reference: CREATE TABLE item_totals AS SELECT itemNo, SUM(qty) AS total FROM combine GROUP BY itemNo;
  check: SELECT itemNo, total FROM item_totals ORDER BY itemNo;

- id: le1-q-alter-email
  type: sql
  topics: [lab.le1, ddl.alter]
  difficulty: 1
  dataset: lab-le1
  show: { tables: [manuSupp] }
  prompt: "Add a column email of type VARCHAR(30) to manuSupp."
  reference: ALTER TABLE manuSupp ADD email VARCHAR(30);
  check: "SELECT column_name, data_type, character_maximum_length FROM information_schema.columns WHERE table_name = 'manusupp' AND table_schema = current_schema() ORDER BY ordinal_position;"

- id: le1-q-function
  type: sql
  topics: [lab.le1, ddl.functions]
  difficulty: 3
  dataset: lab-le1
  show: { tables: [combine] }
  prompt: "Write a PL/pgSQL function supplier_total(s VARCHAR) that returns the total quantity supplied by supplier s (null if none)."
  reference: |
    CREATE OR REPLACE FUNCTION supplier_total(s VARCHAR)
    RETURNS INTEGER
    LANGUAGE plpgsql
    AS $$
    DECLARE
      t INTEGER;
    BEGIN
      SELECT SUM(qty) INTO t FROM combine WHERE manuSupitemNo = s;
      RETURN t;
    END;
    $$;
  check: SELECT manuSupitemNo, supplier_total(manuSupitemNo) FROM manuSupp ORDER BY manuSupitemNo;

- id: le1-q-trigger
  type: sql
  topics: [lab.le1, ddl.triggers]
  difficulty: 3
  dataset: lab-le1
  show: { tables: [combine] }
  prompt: "Create a table combine_log with the same columns as combine and no rows, then a trigger function and an AFTER DELETE … FOR EACH ROW trigger on combine that copies every deleted combine row into combine_log. (The check then deletes supplier M4's rows.)"
  reference: |
    CREATE TABLE combine_log AS SELECT * FROM combine WHERE 1 = 2;
    CREATE OR REPLACE FUNCTION log_combine_delete()
    RETURNS TRIGGER
    LANGUAGE plpgsql
    AS $$
    BEGIN
      INSERT INTO combine_log VALUES (OLD.manuSupitemNo, OLD.itemNo, OLD.projNo, OLD.qty);
      RETURN OLD;
    END;
    $$;
    CREATE TRIGGER combine_deleted AFTER DELETE ON combine FOR EACH ROW EXECUTE FUNCTION log_combine_delete();
  check: "DELETE FROM combine WHERE manuSupitemNo = 'M4'; SELECT * FROM combine_log ORDER BY itemNo, projNo;"
  hints: ["In a DELETE trigger the row is in OLD.", "CREATE TABLE … AS SELECT * FROM combine WHERE 1 = 2 makes the empty copy."]

# ---------------------------------------------------------------- more queries in the exam's style

- id: le1-q-project-totals-zero
  type: sql
  topics: [lab.le1, sql.joins, sql.group-by]
  tags: [lab-query]
  difficulty: 2
  dataset: lab-le1
  show: { tables: [proj, combine] }
  prompt: "List every project's name and the total quantity supplied to it. A project with nothing supplied shows 0."
  reference: SELECT p.proJNAME, COALESCE(SUM(c.qty), 0) FROM proj p LEFT JOIN combine c ON p.proJNo = c.projNo GROUP BY p.proJNo, p.proJNAME;
  explanation: "LEFT JOIN keeps projects with no combine rows; SUM over nothing is NULL, so COALESCE turns it into 0."

- id: le1-q-wide-suppliers
  type: sql
  topics: [lab.le1, sql.having, sql.distinct-order]
  tags: [lab-query]
  difficulty: 2
  dataset: lab-le1
  compare: ordered
  show: { diagram: true }
  prompt: "List the name of each supplier that supplies at least 3 different projects, with the number of projects, most projects first."
  reference: |
    SELECT s.sname, COUNT(DISTINCT c.projNo) AS projects
    FROM manuSupp s JOIN combine c ON s.manuSupitemNo = c.manuSupitemNo
    GROUP BY s.manuSupitemNo, s.sname
    HAVING COUNT(DISTINCT c.projNo) >= 3
    ORDER BY projects DESC;

