id: nf-lossy
title: A lossy and a non-loss decomposition (Week 7)
description: >
  The lecture's U(A, B, C) with two rows, and its projections. R1(A, B) and R3(A, C) share A, which is a key of
  both, so joining them gives back U. R1(A, B) and R2(B, C) share only B, which isn't a key of either, so the
  join invents rows.
source: Week 7 lecture (example credited there to Dr. Fangju Wang's notes)
