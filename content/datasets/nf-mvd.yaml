id: nf-mvd
title: SCH and CONTACT (Week 8)
description: >
  SCH(student, course, hobby) is the lecture's student, courses and hobbies table after flattening to 1NF: a
  student's courses and hobbies are independent, so every course is paired with every hobby. SC and SH are its 4NF
  decomposition. CONTACT is the lecture's denormalization example; ZIP and CONTACT3 split it into 3NF.
source: Week 8 lecture (SCH and CONTACT rows copied from the slides)
tables:
