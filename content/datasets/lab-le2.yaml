id: lab-le2
title: "Lab exam schema 2: Movie, Reviewer, Rating"
description: >
  Copied exactly from create_and_insert_LE2.sql. Note that the script declares no primary or foreign keys at all: nothing stops duplicate movies, a rating for a movie that doesn't exist, or a reviewer rating the same movie twice (Sarah Martinez rates Gone with the Wind twice). Snow White has no director (null), and two ratings have no date.
source: create_and_insert_LE2.sql (lab exam practice file)
tables:
  - name: Movie
    columns:
      - { name: mID, type: int, sql: "int" }
      - { name: title, sql: "text" }
      - { name: year, type: int, sql: "int" }
      - { name: director, sql: "text" }
