id: lab-le2-alt
title: "Lab exam schema 2 (hidden grading instance)"
description: >
  Same schema as lab-le2 with different rows: a movie nobody rated, a reviewer with no ratings, another null director, and re-ratings that go both up and down, so answers that only work on the original rows are caught.
