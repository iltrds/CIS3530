name: Test and deploy

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      # deploy only once the Cloudflare secrets exist; until then CI still tests and builds
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Tests (RA engine, grading, every content answer key)
        run: bun test
      - name: Build
        run: bun run build
      # Cloudflare Pages. Pushes to main deploy to production; other branches get a preview URL.
      # Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, and a Pages project named cis3530-study.
      - name: Deploy to Cloudflare Pages
        if: ${{ env.HAS_CF == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@3 pages deploy dist --project-name=cis3530-study --branch=${{ github.ref_name }}
